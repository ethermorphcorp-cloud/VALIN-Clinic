<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALIN CLINIC · ระบบบริหารคลินิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
/* ===================== Design tokens ===================== */
:root{
  /* ===== Round 12 re-theme: navy + gold, matching the client's reference
     screenshot. Content area stays light/white; the sidebar gets its own
     dark-navy token set (--sidebar-*) below since it's a two-tone theme,
     not a single global palette flip. ===== */
  --bg:#F5F6FA; --surface:#FFFFFF;
  --border:#E4E8F1; --border-soft:#ECEFF6; --border-lighter:#F1F3F9; --sidebar-border:#16244A; --input-border:#DCE1EC;
  --input-bg:#F7F8FC; --hover-bg:#F0F2F9; --hover-bg2:#E7EBF5;
  --text:#1C2440; --text-2:#3D4568; --text-3:#2A3253; --muted:#8891AC; --muted-2:#6C7595; --muted-3:#A6ADC5; --muted-4:#B8BED2; --icon-muted:#98A0BC;
  --accent:#1E3A72; --accent-hover:#16295A; --accent-soft:#E9EDF7; --accent-soft2:#F1F3FA;
  --gold:#C9A961; --gold-dark:#AD8C46; --gold-soft:#F8F1DE;
  --green:#4E9D6E; --green-dark:#357552; --green-soft:#E7F5EC; --olive:#8FBF7A;
  --pink:#C0709A; --pink-dark:#95547A; --pink-soft:#F6E9F0;
  --red:#D1585A; --red-dark:#AC4143; --red-soft:#FBEBEB;
  --amber-dark:#B4791E; --amber-soft:#FBF1DE;
  --r:14px; --r-sm:9px; --r-lg:16px;
  /* Sidebar-only tokens (dark navy chrome, light-on-dark text) */
  --sidebar-bg:#0F1B3D; --sidebar-bg-2:#0B1530; --sidebar-active-bg:rgba(255,255,255,.08);
  --sidebar-text:#E7EAF5; --sidebar-text-muted:#8993B8; --sidebar-hover-bg:rgba(255,255,255,.05);
  --sidebar-border-soft:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Noto Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
button,input,textarea,select{font-family:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;vertical-align:middle}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#DCE1EC;border-radius:8px;border:3px solid var(--bg)}
::selection{background:var(--accent-soft)}

/* ===================== Layout ===================== */
.app-shell{display:flex;min-height:100vh;background:var(--bg);color:var(--text)}
.sidebar{width:250px;flex:none;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:52px;height:52px;border-radius:13px;background:var(--gold);color:var(--sidebar-bg);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:.5px}
.brand-name{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.4px}
.brand-sub{font-size:11px;color:var(--sidebar-text-muted);font-weight:300}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .15s;color:var(--sidebar-text-muted)}
.nav-item:hover{background:var(--sidebar-hover-bg)}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-text)}
.nav-item:not(.active){color:var(--sidebar-text-muted)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.side-label{font-size:10.5px;color:var(--sidebar-text-muted);letter-spacing:.8px;padding:0 12px;font-weight:500}
.preview-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500}
.preview-item:hover{background:var(--sidebar-hover-bg)}
.preview-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-text)}
.preview-item:not(.active){color:var(--sidebar-text-muted)}
.user-wrap{position:relative}
.user-card{background:var(--sidebar-hover-bg);border:1px solid var(--sidebar-border-soft);border-radius:12px;padding:12px 13px;display:flex;gap:10px;align-items:center;cursor:pointer}
.user-card:hover{background:var(--sidebar-active-bg)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--sidebar-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.user-menu{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 34px rgba(15,27,61,.22);overflow:hidden;z-index:20}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:11px 13px;font-size:12.5px;color:var(--text-2);cursor:pointer;border-bottom:1px solid var(--border-lighter)}
.user-menu-item:last-child{border-bottom:none;color:var(--red-dark)}
.user-menu-item:hover{background:var(--input-bg)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:16px;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:5}
.page-title{font-size:19px;font-weight:600;color:var(--text);letter-spacing:.2px}
.page-sub{font-size:12px;color:var(--muted);font-weight:300;margin-top:2px}
.header-chip{display:flex;align-items:center;gap:8px;background:var(--hover-bg);border:1px solid var(--input-border);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.icon-square{width:37px;height:37px;border-radius:10px;background:var(--hover-bg);border:1px solid var(--input-border);display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;position:relative;flex:none}
.icon-square:hover{background:var(--hover-bg2)}
.dot-badge{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.content{padding:26px 32px 48px;display:flex;flex-direction:column;gap:22px}

/* ===================== Reusable bits ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,27,61,.04)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{border-color:var(--input-border);color:var(--text-2);background:var(--surface)}
.btn-outline:hover{background:var(--hover-bg)}
.btn-ghost{color:var(--text-2);cursor:pointer}
.icon-btn{font-size:17px;padding:7px;border-radius:8px;cursor:pointer;display:inline-flex}
.icon-btn.edit{color:var(--accent);background:var(--hover-bg)}
.icon-btn.del{color:var(--red);background:var(--red-soft)}
.icon-btn.print{color:var(--green);background:var(--green-soft)}
.table{width:100%;border-collapse:collapse}
.table thead tr{background:var(--input-bg)}
.table th{text-align:left;padding:12px 20px;font-size:11.5px;font-weight:500;color:var(--muted)}
.table td{padding:13px 20px;font-size:13px;color:var(--text)}
.table tbody tr{border-top:1px solid var(--border-lighter)}
.table tbody tr:hover{background:#F6F7FC}
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:500}
.badge-tag{font-size:11.5px;background:var(--border-soft);color:var(--text-2);padding:4px 10px;border-radius:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text-2)}
.field .req{color:var(--red-dark)}
.input,.select-fake,textarea.input{border:1px solid var(--input-border);background:var(--input-bg);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--accent)}
.input-wrap{display:flex;align-items:center;gap:9px;border:1px solid var(--input-border);background:var(--input-bg);border-radius:var(--r-sm);padding:9px 13px}
.input-wrap input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);width:100%}
.select-fake{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;color:var(--text)}
.dropdown{position:relative}
.dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--input-border);border-radius:11px;box-shadow:0 12px 28px rgba(15,27,61,.14);overflow:hidden;z-index:30;min-width:210px}
.dropdown-panel.up{top:auto;bottom:calc(100% + 6px)}
.dropdown-option{display:flex;align-items:center;gap:9px;padding:10px 13px;font-size:12.5px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border-lighter);white-space:nowrap}
.dropdown-option:last-child{border-bottom:none}
.dropdown-option:hover{background:var(--input-bg)}
.dropdown-option .ms{font-size:16px;color:var(--accent)}
.tab-row{display:flex;gap:26px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab-item{display:flex;align-items:center;gap:8px;padding:0 2px 12px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-item.active{color:var(--accent);border-color:var(--accent)}
.pill-toggle{display:flex;background:var(--border-soft);border-radius:10px;padding:3px}
.pill-toggle .item{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted-2)}
.pill-toggle .item.active{background:var(--surface);color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--muted)}
.pager-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--input-border);color:var(--text-2)}
.pager-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.placeholder-box{border:1px dashed var(--muted-4);background:repeating-linear-gradient(45deg,var(--hover-bg),var(--hover-bg) 6px,var(--border-soft) 6px,var(--border-soft) 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}

/* ===================== Overlays ===================== */
.overlay{position:fixed;inset:0;background:rgba(15,27,61,.28);z-index:35;display:flex;justify-content:flex-end}
.overlay.center{background:rgba(15,27,61,.34);z-index:40;justify-content:center;align-items:flex-start;padding:48px 20px;overflow-y:auto}
.panel{background:var(--surface);height:100%;box-shadow:-14px 0 44px rgba(15,27,61,.16);display:flex;flex-direction:column}
.panel-head{display:flex;align-items:flex-start;gap:14px;padding:22px 24px;border-bottom:1px solid var(--border-soft);background:#F6F7FC}
.panel-close{font-size:20px;color:var(--muted);cursor:pointer;padding:4px}
.panel-body{flex:1;overflow-y:auto;padding:18px 24px 26px;display:flex;flex-direction:column;gap:11px}
.panel-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 24px;border-top:1px solid var(--border-soft);background:#F6F7FC}
.modal{width:100%;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(15,27,61,.22);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-soft)}
.modal-title{font-size:15.5px;font-weight:600;color:var(--text)}
.modal-sub{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:16px;max-height:66vh;overflow-y:auto}
.modal-foot{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--border-soft);background:#F6F7FC}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid-fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.line-row{display:grid;gap:10px;align-items:center}

/* ===================== Toast ===================== */
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:#FDFBF8;padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);animation:toastIn .25s ease forwards}
@keyframes toastIn{to{opacity:1;transform:translateY(0)}}

/* ===================== Dashboard specifics ===================== */
.stat-card{padding:16px 17px;display:flex;flex-direction:column;gap:11px}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:12px;color:var(--muted);font-weight:400}
.stat-value{font-size:23px;font-weight:600;color:var(--text);letter-spacing:-.3px}
.stat-trend{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500}
.chart-card{padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted-2)}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.bars{position:relative;height:230px;margin-top:2px}
.bars-grid{position:absolute;inset:0 0 22px 0;display:flex;flex-direction:column;justify-content:space-between}
.bars-grid i{border-top:1px dashed var(--border)}
.bars-grid i:last-child{border-top:1px solid var(--border)}
.bars-cols{position:absolute;inset:0 0 22px 0;display:flex;align-items:flex-end;gap:14px}
.bars-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bars-col-inner{width:100%;display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.bars-labels{position:absolute;left:0;right:0;bottom:0;display:flex;gap:14px}
.bars-labels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:22px;flex:1;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.donut-hole{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-rows{display:flex;flex-direction:column;gap:9px;flex:1 1 150px;min-width:150px}
.donut-row{display:flex;align-items:center;gap:9px;font-size:12px}
.bar-rows{display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1}
.bar-row-top{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)}
.bar-track{height:9px;border-radius:6px;background:var(--border-soft);overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.chart-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:stretch}
.chart-row{border-top:1px solid var(--border);padding-top:22px}

/* ===================== Calendar ===================== */
.cal-wrap{flex:1 1 620px;min-width:0;padding:20px;height:calc(100vh - 208px);min-height:480px;display:flex;flex-direction:column}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav{display:flex;gap:6px}
.cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:6px}
.cal-day{min-height:0;overflow:hidden;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:1px solid var(--border-soft)}
.cal-day:hover{border-color:var(--accent)}
.cal-day .n{font-size:12px;font-weight:500}
.cal-evt{font-size:9.5px;border-radius:5px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-more{font-size:9.5px;color:var(--muted);padding-left:2px}
.agenda-wrap{flex:1 1 280px;max-width:340px;min-width:280px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;height:calc(100vh - 208px);min-height:480px;overflow-y:auto}
.agenda-item{display:flex;gap:12px;padding:11px;border-radius:11px;background:var(--input-bg);border:1px solid var(--border-soft)}

/* ===================== Login ===================== */
.login-shell{min-height:100vh;display:grid;grid-template-columns:3fr 1fr;background:var(--bg)}
.login-art{background:var(--accent-soft);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:48px 52px;overflow:hidden}
.login-art>*{position:relative}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px}
.login-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:20px}
.strength-bar{display:flex;gap:5px;margin-top:3px}
.strength-bar i{flex:1;height:4px;border-radius:3px;display:block;background:var(--input-border)}
@media (max-width:880px){
  .login-shell{grid-template-columns:1fr}
  .login-art{display:none}
}

/* ===================== Receipt ===================== */
.receipt{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 26px rgba(15,27,61,.10);padding:40px 44px;display:flex;flex-direction:column;gap:26px;margin:0 auto}
.receipt table{width:100%;border-collapse:collapse}
.receipt th{text-align:left;padding:9px 0;font-size:11px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--border)}
.receipt td{padding:11px 0;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border-lighter)}
@media print{
  .sidebar,.header,.no-print{display:none !important}
  .content{padding:0}
  body{background:#fff}
}

/* ===================== Responsive ===================== */
@media (max-width:1000px){
  .sidebar{width:72px;padding:16px 8px}
  .brand-name,.brand-sub,.nav-item span:not(.ms),.preview-item span:not(.ms),.side-label,.user-info{display:none}
  .nav-item,.preview-item{justify-content:center}
  .user-card{justify-content:center}
}
@media (max-width:720px){
  .chart-grid{grid-template-columns:1fr}
  .header{padding:14px 14px}
  .content{padding:16px 14px 40px}
  .page-title,.page-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-chip{display:none}
  .grid-fit{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}

/* ===================== Extras: spinner / toast(Swal) / portal dropdown / pagination ===================== */
.gs-loading-overlay{position:fixed;inset:0;background:rgba(245,246,250,.7);z-index:9999;display:none;align-items:center;justify-content:center}
.gs-loading-overlay.on{display:flex}
.gs-loading-overlay .spin-lg{width:46px;height:46px;border-radius:50%;border:4px solid rgba(30,58,114,.20);border-top-color:var(--accent);animation:gs-spin .7s linear infinite}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(30,58,114,.20);border-top-color:var(--accent);animation:gs-spin .7s linear infinite;vertical-align:middle}
.btn .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff;margin-right:6px}
@keyframes gs-spin{to{transform:rotate(360deg)}}
.portal-dd{position:fixed;z-index:5000;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:0 12px 30px rgba(15,27,61,.16);max-height:260px;overflow:auto;min-width:180px;display:none}
.portal-dd.open{display:block}
.portal-dd .opt{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.portal-dd .opt:hover{background:var(--hover-bg)}
.portal-dd .opt.active{color:var(--accent);font-weight:600}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:12px 4px 2px;font-size:12.5px;color:var(--text-2)}
.pager button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.rbac-hide{display:none !important}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.supply-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.supply-row .g{flex:1}
.tag-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.upload-drop{border:1.5px dashed var(--border);border-radius:var(--r-sm);padding:16px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.upload-drop:hover{border-color:var(--accent)}
.upload-progress{height:5px;border-radius:3px;background:var(--input-border);overflow:hidden;margin-top:8px}
.upload-progress i{display:block;height:100%;background:var(--green);width:0;transition:width .15s}
/* Sidebar nav items are plain rows (no button chrome/frame) */
.nav-item{border:none;background:none;width:100%;text-align:left}
.user-card:hover{background:var(--hover-bg)}
/* Right-side slide-out panel (patient detail / record detail) */
.side-panel-backdrop{position:fixed;inset:0;background:rgba(15,27,61,.32);z-index:2500;display:flex;justify-content:flex-end}
.side-panel{width:440px;max-width:92vw;height:100%;background:var(--surface);box-shadow:-10px 0 34px rgba(15,27,61,.18);display:flex;flex-direction:column;animation:side-panel-in .22s ease}
@keyframes side-panel-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
.swal2-container{z-index:9500 !important}
/* Segmented pill toggle (e.g. record modal's "สถานะ" นัดหมาย/เสร็จสิ้น field) */
.pill-group{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;background:var(--hover-bg)}
.pill-group button{border:none;background:none;padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-2);font-family:inherit}
.pill-group button.active{background:var(--green);color:#fff}
/* Patient search suggestion rows with an avatar-initial circle (record modal) */
.patient-suggest-row{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer}
.patient-suggest-row:hover{background:var(--hover-bg)}
.patient-suggest-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-hover);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none}
.patient-suggest-name{font-size:13px;font-weight:600}
.patient-suggest-phone{font-size:11.5px;color:var(--muted)}
/* Shared underlined tab bar (Expense/Settings pages) — replaces the old
   button-group style so switching sub-views reads as "tabs", not "filters". */
.tab-bar{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tab-item{background:none;border:none;padding:10px 2px;font-size:13.5px;color:var(--muted);cursor:pointer;position:relative;font-family:inherit}
.tab-item:hover{color:var(--text)}
.tab-item.active{color:var(--accent);font-weight:700}
.tab-item.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
/* Category chips (Settings > หมวดหมู่ — grouped cards, no type switcher) */
.cat-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer}
.cat-chip .x{cursor:pointer;color:var(--muted);display:flex;border-radius:50%}
.cat-chip .x:hover{color:var(--red-dark)}
.cat-chip-add{display:inline-flex;align-items:center;gap:3px;padding:6px 14px;border-radius:999px;border:1.5px dashed var(--border);color:var(--muted);font-size:12.5px;font-weight:600;background:none;cursor:pointer;font-family:inherit}
.cat-chip-add:hover{border-color:var(--accent);color:var(--accent)}
/* Search-style text inputs (patient/supply pickers, list-page search bars) —
   a leading magnifying-glass icon so these read as "type to find" boxes
   rather than plain text fields. */
.search-input-wrap{position:relative}
.search-input-wrap input{padding-left:34px !important}
.search-input-wrap input:focus{border-color:var(--accent);outline:none}
.search-input-wrap .search-ic{position:absolute;left:10px;top:50%;transform:translate(0,-50%);color:var(--muted);font-size:18px;pointer-events:none}
/* Day-summary panel (Records calendar day-click) — sectioned card layout
   matching the design also used for the LINE push message, see
   dayPanelTemplate() in client.js. Header was navy (Round 6) — round 8
   changed it to the app's own accent theme color instead, so the panel
   matches the rest of the web app; Line.html's header was updated to the
   same color to keep the two surfaces visually identical. */
.day-summary-header{background:var(--accent);color:#fff;padding:18px 22px}
.day-summary-section{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:12px}
.day-summary-section-title{font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
/* Round 20 item 1: each collapsible day-summary row's detail block is
   always present in the DOM (see daySummaryItem() in client.js) and is
   shown/hidden purely by animating max-height/opacity here, toggled via a
   direct DOM class swap in toggleDaySection() rather than a full panel
   re-render — this is what makes the row "toggle down" smoothly instead of
   flickering/snapping. The collapsed max-height:0 is a safe default for the
   very first paint; toggleDaySection() overrides it with an exact
   scrollHeight px value inline so the open state always fits its content,
   and the .day-detail-open fallback below (a generous cap, not a real
   measurement) only matters for a state that started already-expanded from
   a fresh full re-render (no animation needed there, so an exact value
   isn't necessary).*/
.day-detail-wrap{max-height:0;opacity:0;overflow:hidden;transition:max-height .28s ease,opacity .2s ease}
.day-detail-wrap.day-detail-open{max-height:2000px;opacity:1}
.day-detail-inner{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.day-summary-net{border-radius:var(--r-sm);padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.day-summary-other{background:var(--amber-soft);border:1px solid #E3C588;border-radius:var(--r-sm);padding:12px 14px}
/* Wider variant of .side-panel — the patient detail panel (item 4) carries a
   visit-history table that's cramped at the default 440px width. */
.side-panel.side-panel-wide{width:600px}
/* Click-through backdrop variant — keeps the dimmed visual treatment but lets
   clicks reach the list underneath (e.g. the patients table), so clicking a
   row can toggle its own panel closed, or jump straight to another row,
   instead of every click behind the panel being swallowed by the modal
   overlay (item 4). The panel itself opts back into normal hit-testing. */
.side-panel-backdrop.side-panel-backdrop-passthrough{pointer-events:none}
.side-panel-backdrop.side-panel-backdrop-passthrough .side-panel{pointer-events:auto}
/* The stock history panel opens ปรับสต๊อก / แก้ไขรายการ modals on top of
   itself, so it sits below the modal layer (2000) instead of above it. */
#stockPanelRoot .side-panel-backdrop{z-index:1900}
/* Stock table: cells never wrap; the wrapper scrolls sideways instead (รายการยา has 11-12 columns). */
.stock-table th,.stock-table td{white-space:nowrap;padding-left:12px;padding-right:12px}
</style>
</head>
<body>
<div class="gs-loading-overlay" id="gsLoadingBar"><div class="spin-lg"></div></div>
<div id="app"></div>
<div id="portalDropdown" class="portal-dd"></div>
<!-- Side panels live in their own root, outside #app, so an unrelated
     full-page render() (e.g. a background list refresh) never recreates
     their DOM node and replays the slide-in animation — see renderPatientPanel/
     renderRecordPanel in client.js. -->
<div id="patientPanelRoot"></div>
<div id="recordPanelRoot"></div>
<div id="dayPanelRoot"></div>
<div id="stockPanelRoot"></div>
<div id="salesReportPanelRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
var LOGIN_IMAGE_URL = <?!= JSON.stringify(loginImageUrl || '') ?>;
(function () {
  'use strict';

  /* ---------------------------------------------------------------- */
  /* Utilities                                                          */
  /* ---------------------------------------------------------------- */
  var esc = function (v) { return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;'); };
  var money = function (n) { return '฿ ' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }); };
  var num = function (n) { return Number(n || 0).toLocaleString('en-US'); };
  // Round 15 item 2.3: "#,###.##" formatting for the record modal's money
  // inputs — thousands-separated, up to 2 decimals, no forced trailing
  // zeros (so a whole number reads "1,500", not "1,500.00").
  var formatMoneyValue = function (n) { return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };
  var parseMoneyInput = function (s) { var n = Number(String(s == null ? '' : s).replace(/,/g, '').trim()); return isNaN(n) ? 0 : n; };
  var isMoneyBindPath = function (p) { return p === 'amount' || p === 'canulaAmount' || /\.amount$/.test(p); };
  var getPath = function (obj, path) { return path.split('.').reduce(function (c, k) { return c == null ? c : c[k]; }, obj); };
  var setPath = function (obj, path, val) {
    var keys = path.split('.'), cur = obj;
    for (var i = 0; i < keys.length - 1; i++) { if (cur[keys[i]] == null) cur[keys[i]] = {}; cur = cur[keys[i]]; }
    cur[keys[keys.length - 1]] = val;
  };
  var todayStr = function () {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  var debounce = function (fn, ms) { var t; return function () { var a = arguments, ctx = this; clearTimeout(t); t = setTimeout(function () { fn.apply(ctx, a); }, ms); }; };
  var uid = 1;
  var nextUid = function (p) { return p + '-' + (uid++); };

  // Round 15 item 8.1: dashboard bar/donut charts moved from a per-slice
  // categorical PALETTE to a single-hue "dark blue -> light blue" sequential
  // ramp — the rows feeding these charts are always pre-sorted largest-to-
  // smallest (see toChartArray_ in Code.gs), so "biggest slice = darkest"
  // reads as a ranking, which is what the client asked for. The two
  // endpoints (#0d366b dark / #86b6ef light) and the 7-step cap come from
  // the dataviz skill's reference sequential blue ramp, checked against its
  // ordinal-ramp validator (single hue, monotone lightness, >=0.06 OKLCH ΔL
  // between adjacent steps, light-end contrast >=2:1 vs the card surface) —
  // 7 is the most steps that ramp clears every check with at once; a chart
  // with more series wraps back to the ramp's start, same as the old
  // PALETTE's per-slice cycling at 8.
  var SEQ_BLUE_DARK = [13, 54, 107], SEQ_BLUE_LIGHT = [134, 182, 239];
  var SEQ_BLUE_STEPS = 7;
  function seqBlueColor(i, n) {
    var steps = Math.min(Math.max(n, 1), SEQ_BLUE_STEPS);
    var t = steps === 1 ? 0 : (i % steps) / (steps - 1);
    var rgb = [0, 1, 2].map(function (k) { return Math.round(SEQ_BLUE_DARK[k] + (SEQ_BLUE_LIGHT[k] - SEQ_BLUE_DARK[k]) * t); });
    return '#' + rgb.map(function (v) { return Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0'); }).join('');
  }
  var withPct = function (rows) {
    var total = rows.reduce(function (s, r) { return s + (Number(r.value) || 0); }, 0) || 1;
    return rows.map(function (r, i) { return { label: r.label, v: r.value, pct: (r.value / total) * 100, color: seqBlueColor(i, rows.length) }; });
  };
  var pctLabel = function (n) { return n.toFixed(2) + '%'; };

  /* ---------------------------------------------------------------- */
  /* Server call layer — Promise wrapper over google.script.run          */
  /* ---------------------------------------------------------------- */
  var pendingCalls = 0;
  var loadingBar = document.getElementById('gsLoadingBar');
  function setLoading(on) {
    pendingCalls += on ? 1 : -1;
    if (pendingCalls < 0) pendingCalls = 0;
    if (pendingCalls > 0) loadingBar.classList.add('on');
    else loadingBar.classList.remove('on');
  }

  function toast(icon, title) {
    // Defensive: if SweetAlert2's CDN failed to load for any reason, a cosmetic
    // notification failure must never abort the caller's subsequent logic
    // (closeModal(), list reloads, etc. run in the same .then() chain as this).
    try {
      if (typeof Swal === 'undefined') { console.warn('[toast]', icon, title); return; }
      Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2600, timerProgressBar: true })
        .fire({ icon: icon, title: title });
    } catch (e) { console.warn('[toast failed]', icon, title, e); }
  }

  /**
   * Calls a server-side function in Code.gs by name. Every wrapped call shows
   * the top loading bar; failures show a toast automatically unless opts.quiet.
   */
  function call(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    var opts = {};
    if (args.length && args[args.length - 1] && args[args.length - 1].__gsOpts) opts = args.pop();
    setLoading(true);
    return new Promise(function (resolve, reject) {
      if (!window.google || !window.google.script || !window.google.script.run) {
        // Local dev / preview fallback so this file can be opened outside GAS for a quick visual check.
        setLoading(false);
        reject(new Error('google.script.run ไม่พร้อมใช้งาน (ต้องรันผ่าน Apps Script Web App)'));
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(function (res) { setLoading(false); resolve(res); })
        .withFailureHandler(function (err) { setLoading(false); reject(err); });
      runner[fnName].apply(runner, args);
    }).then(function (res) {
      if (res && res.ok === false) {
        if (!opts.quiet) toast('error', res.message || 'เกิดข้อผิดพลาด');
        var e = new Error(res.message || 'เกิดข้อผิดพลาด'); e.serverResult = res; throw e;
      }
      return res;
    }, function (err) {
      if (!opts.quiet) toast('error', (err && err.message) || 'การเชื่อมต่อผิดพลาด');
      throw err;
    });
  }
  function gsOpts(o) { return Object.assign({ __gsOpts: true }, o); }

  /* ---------------------------------------------------------------- */
  /* Session                                                             */
  /* ---------------------------------------------------------------- */
  var session = { token: null, user: null };
  try {
    var savedRaw = localStorage.getItem('valin_session');
    if (savedRaw) session = JSON.parse(savedRaw);
  } catch (e) { /* private mode / storage disabled — fall back to in-memory session */ }
  function persistSession() {
    try { localStorage.setItem('valin_session', JSON.stringify(session)); } catch (e) { /* ignore */ }
  }
  function clearSession() {
    session = { token: null, user: null };
    try { localStorage.removeItem('valin_session'); } catch (e) { /* ignore */ }
  }
  function isAdmin() { return session.user && session.user.level === 'admin'; }

  /* ---------------------------------------------------------------- */
  /* App state                                                          */
  /* ---------------------------------------------------------------- */
  // Round 18 item 2: `adminOnly` gates a nav entry from staff entirely (not
  // just individual buttons within a page, which was the only RBAC that
  // existed before this round — see isAdmin() usages elsewhere for those).
  // Filtered out of both the sidebar list (shellTemplate) and the initial
  // post-login landing screen (afterLogin) — see goNav()'s guard too.
  var NAV = [
    { id: 'dash', label: 'Dashboard', icon: 'space_dashboard', sub: 'ภาพรวมรายได้ ค่าใช้จ่าย และกำไรของคลินิก', adminOnly: true },
    { id: 'patients', label: 'ข้อมูลคนไข้', icon: 'groups', sub: 'ฐานข้อมูลลูกค้าและประวัติการติดต่อ' },
    { id: 'records', label: 'บันทึกการรักษา', icon: 'medical_services', sub: 'รายการรักษา นัดหมาย และการออกใบเสร็จ' },
    { id: 'stock', label: 'จัดการสต๊อก', icon: 'inventory_2', sub: 'สต๊อกเวชภัณฑ์และสต๊อกยา' },
    { id: 'withdraw', label: 'เบิกยาคลีนิค', icon: 'medication', sub: 'รายการเบิกยาจากสต๊อกคลินิกให้คนไข้ (คิดราคาทุน)' },
    { id: 'salesreport', label: 'รายงานเซลล์', icon: 'assessment', sub: 'รายงานการเบิกยาแยกตามเซลล์และช่วงวันที่ (ราคาทุน)', adminOnly: true },
    { id: 'expense', label: 'ค่าใช้จ่าย & จัดซื้อ', icon: 'receipt_long', sub: 'ค่าใช้จ่ายคลินิกและรายการสั่งซื้อ', adminOnly: true },
    { id: 'promotions', label: 'จัดการโปรโมชันหน้าคลินิก', icon: 'local_offer', sub: 'รายการโปรโมชันและส่วนแบ่งแพทย์/คลินิก' },
    { id: 'settings', label: 'ตั้งค่าคลินิก', icon: 'settings', sub: 'แพทย์ หมวดหมู่ ข้อมูลคลินิก และผู้ใช้งาน', adminOnly: true }
  ];
  function allowedNav() { return NAV.filter(function (n) { return isAdmin() || !n.adminOnly; }); }

  var state = {
    screen: 'login', loginError: '', loginBusy: false,
    master: null, // doctors/sales/categories/clinicInfo/staff (staff only if admin)
    // Suggestion caches (patient/stock autocomplete) — loaded once on first
    // app load and only re-fetched after a save/delete touches that entity.
    suggestCache: { patients: null, stock: null },
    modal: null, draft: null, portal: null,
    dash: { data: null, from: (todayStr()).slice(0, 8) + '01', to: todayStr() },
    // Round 15 item 4: "searchSuggest"/"orderSearchSuggest" hold the current
    // suggest-dropdown items for each screen's search box (see SEARCH_SCOPES
    // below) — typing only populates these; the table itself only reloads
    // once a suggestion is picked.
    patients: { list: null, page: 1, q: '', panel: null, photoProgress: null, searchSuggest: [] },
    records: { list: null, page: 1, q: '', doctorId: '', status: '', view: 'list', calYear: new Date().getFullYear(), calMonth: new Date().getMonth() + 1, calData: null, panel: null, dayPanel: null, opdPhotoUrl: null, opdPhotoProgress: null, searchSuggest: [], reloading: false },
    // `type` is the active tab: 'supply' (รายการเวชภัณฑ์) | 'medicine' (รายการยา).
    // `panel` is the open history side panel: {item, log} (log null while loading).
    stock: { type: 'supply', list: null, page: 1, q: '', category: '', searchSuggest: [], reloading: false, panel: null },
    // Round 19 item 2: `reloading`/`orderReloading` drive a dim-in-place
    // transition on the table (instead of a hard content-swap with zero
    // feedback in between) while a dropdown-filter-triggered reload is in
    // flight — see the dd-* action handlers and the loadX() functions below.
    expense: { tab: 'expense', list: null, page: 1, q: '', category: '', orders: null, orderPage: 1, orderQ: '', orderCategory: '', searchSuggest: [], orderSearchSuggest: [], reloading: false, orderReloading: false },
    promotions: { list: null, q: '' },
    withdraw: { list: null, page: 1, q: '', reloading: false },
    // `data` stays null until "ดูรายงาน" is pressed; `panel` is the open detail row.
    salesReport: { salesId: '', from: todayStr().slice(0, 8) + '01', to: todayStr(), data: null, loading: false, panel: null },
    settings: { tab: 'doctors', staff: null, loginImageProgress: null, logoProgress: null }
  };

  /* ---------------------------------------------------------------- */
  /* Render engine (focus-preserving full re-render, per Phase-2 pattern) */
  /* ---------------------------------------------------------------- */
  var root = document.getElementById('app');
  function render() {
    var active = document.activeElement;
    var focusInfo = null;
    if (active && active.id && root.contains(active)) {
      focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd, scroll: active.scrollTop };
    }
    // Round 14 item 1.6: a full render() (e.g. clicking "+เพิ่มรายการ",
    // toggling a checkbox) recreates the whole DOM tree, including the
    // record modal's own scrollable wrapper (.modal, overflow:auto — see
    // modalTemplate()) — without this, its scrollTop resets to 0 on every
    // such action and the modal visibly jumps back to the top. This is
    // separate from focusInfo.scroll above, which only preserves a
    // *focused element's own* internal scroll (e.g. a textarea's content
    // scroll), not an ancestor container's.
    var modalEl = document.querySelector('.modal');
    var modalScrollTop = modalEl ? modalEl.scrollTop : null;
    root.innerHTML = screenTemplate();
    if (focusInfo) {
      var el = document.getElementById(focusInfo.id);
      if (el) {
        el.focus();
        if (typeof focusInfo.start === 'number' && el.setSelectionRange) {
          try { el.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) { /* not a text input */ }
        }
        if (typeof focusInfo.scroll === 'number') el.scrollTop = focusInfo.scroll;
      }
    }
    if (modalScrollTop != null) {
      var newModalEl = document.querySelector('.modal');
      if (newModalEl) newModalEl.scrollTop = modalScrollTop;
    }
    positionPortal();
  }

  /* ---------------------------------------------------------------- */
  /* Portal dropdown — one shared fixed-position element so options are  */
  /* never clipped by overflow:hidden tables/cards.                      */
  /* ---------------------------------------------------------------- */
  var portalEl = document.getElementById('portalDropdown');
  function openPortal(triggerId, options, onPick, currentValue) {
    state.portal = { triggerId: triggerId, options: options, onPick: onPick, value: currentValue };
    renderPortal();
  }

  /* ---------------------------------------------------------------- */
  /* Side panels — each lives in its own persistent DOM root (outside    */
  /* #app) with its own dedicated render function, precisely so an       */
  /* unrelated full-page render() never recreates the panel's DOM node   */
  /* and replays its slide-in animation. Every place that used to call   */
  /* the global render() after touching state.patients.panel /           */
  /* state.records.panel / state.records.dayPanel now calls the matching */
  /* renderXPanel() instead.                                              */
  /* ---------------------------------------------------------------- */
  var patientPanelEl = document.getElementById('patientPanelRoot');
  var recordPanelEl = document.getElementById('recordPanelRoot');
  var dayPanelEl = document.getElementById('dayPanelRoot');
  function renderPatientPanel() { patientPanelEl.innerHTML = patientPanelTemplate(); }
  /** Round 16 item 3: openRecordPanel() calls this 2-3 times in quick
   *  succession per open (an optimistic `{loading:true}` render, then the
   *  real record once getRecord resolves, then again once the OPD photo's
   *  data URI arrives) — and this used to fully replace #recordPanelRoot's
   *  innerHTML every time, recreating the `.side-panel-backdrop`/
   *  `.side-panel` nodes from scratch on each call. Since `.side-panel`'s
   *  slide-in is a CSS animation tied to the element's own lifecycle, every
   *  one of those later re-renders restarted it — the panel visibly
   *  "double-slid" (or kept re-sliding) instead of sliding in once and
   *  settling, which is what "check the smoothness of opening the sidebar"
   *  was reporting. Fix: once the shell already exists in the DOM, patch
   *  only its inner body content in place; only build the shell (and let
   *  the animation play) on the first render of a given panel-open. */
  function renderRecordPanel() {
    if (!state.records.panel) { recordPanelEl.innerHTML = ''; return; }
    var shell = recordPanelEl.querySelector('.side-panel-backdrop .side-panel');
    if (shell) { shell.innerHTML = recordPanelBodyHtml(); return; }
    recordPanelEl.innerHTML = recordPanelTemplate();
  }

  function closePortal() { state.portal = null; renderPortal(); }
  function renderPortal() {
    if (!state.portal) { portalEl.classList.remove('open'); portalEl.innerHTML = ''; return; }
    var p = state.portal;
    portalEl.innerHTML = p.options.map(function (o) {
      var active = String(o.value) === String(p.value) ? ' active' : '';
      // Optional `icon` (Material Symbols name) and `danger` (red, for delete-type actions) — used by action menus.
      if (o.icon) {
        return '<div class="opt' + active + '" data-portal-pick="' + esc(o.value) + '" style="justify-content:flex-start;align-items:center' + (o.danger ? ';color:var(--red-dark)' : '') + '">' +
          '<span class="ms" style="font-size:18px;margin-right:10px' + (o.danger ? '' : ';color:var(--muted-2)') + '">' + esc(o.icon) + '</span>' + esc(o.label) + '</div>';
      }
      return '<div class="opt' + active + '" data-portal-pick="' + esc(o.value) + '">' + esc(o.label) + '</div>';
    }).join('') || '<div class="opt" style="color:var(--muted)">ไม่มีตัวเลือก</div>';
    portalEl.classList.add('open');
    positionPortal();
  }
  function positionPortal() {
    if (!state.portal) return;
    var trigger = document.getElementById(state.portal.triggerId);
    if (!trigger) { closePortal(); return; }
    var r = trigger.getBoundingClientRect();
    var estHeight = Math.min(260, (state.portal.options.length || 1) * 38 + 8);
    var roomBelow = window.innerHeight - r.bottom;
    var openUpward = roomBelow < estHeight + 12 && r.top > estHeight + 12;
    portalEl.style.left = Math.min(r.left, window.innerWidth - 220) + 'px';
    if (openUpward) {
      portalEl.style.top = 'auto';
      portalEl.style.bottom = (window.innerHeight - r.top + 6) + 'px';
    } else {
      portalEl.style.bottom = 'auto';
      portalEl.style.top = (r.bottom + 6) + 'px';
    }
    portalEl.style.width = Math.max(r.width, 180) + 'px';
  }
  window.addEventListener('resize', positionPortal);
  window.addEventListener('scroll', positionPortal, true);

  /* ---------------------------------------------------------------- */
  /* Pagination helper — renders controls for a {page,pages,total} blob   */
  /* ---------------------------------------------------------------- */
  function pagerHtml(pageInfo, action) {
    if (!pageInfo || pageInfo.pages <= 1) return '';
    var p = pageInfo.page, n = pageInfo.pages;
    var btns = '';
    btns += '<button data-action="' + action + '" data-arg="' + (p - 1) + '"' + (p <= 1 ? ' disabled' : '') + '><span class="ms">chevron_left</span></button>';
    var startP = Math.max(1, p - 2), endP = Math.min(n, p + 2);
    for (var i = startP; i <= endP; i++) {
      btns += '<button data-action="' + action + '" data-arg="' + i + '"' + (i === p ? ' class="active"' : '') + '>' + i + '</button>';
    }
    btns += '<button data-action="' + action + '" data-arg="' + (p + 1) + '"' + (p >= n ? ' disabled' : '') + '><span class="ms">chevron_right</span></button>';
    return '<div class="pager"><span>ทั้งหมด ' + pageInfo.total + ' รายการ</span>' + btns + '</div>';
  }

  /** Round 19 item 2: wraps a list page's `.card` table in a dim-in-place

  function listCardWrap(tableHtml, isReloading) {

  function doLogin() {
    var u = document.getElementById('loginUsername').value.trim();
    var p = document.getElementById('loginPassword').value;
    if (!u || !p) return;
    state.loginBusy = true; state.loginError = ''; render();
    call('login', u, p, gsOpts({ quiet: true })).then(function (res) {
      state.loginBusy = false;
      if (!res.ok) { state.loginError = res.message || 'เข้าสู่ระบบไม่สำเร็จ'; render(); return; }
      session = { token: res.token, user: res.user };
      persistSession();
      afterLogin();
    }, function (err) {
      state.loginBusy = false; state.loginError = (err && err.message) || 'เข้าสู่ระบบไม่สำเร็จ'; render();
    });
  }

  function afterLogin() {
    // Round 18 item 2: Dashboard is now admin-only (see NAV's `adminOnly`
    // flags) — a staff session can't land on a screen its own sidebar never

    // see instead (บันทึกการรักษา, currently — recomputed from `allowedNav()`

    // ever changes).
    state.screen = isAdmin() ? 'dash' : allowedNav()[0].id;
    call('getMasterData', session.token, gsOpts({ quiet: true })).then(function (res) {
      if (res.ok) state.master = res.data;
      render();
      if (state.screen === 'dash') loadDash();
      // Clinic logo (Settings > ข้อมูลบริษัท) shows in the sidebar brand
      // mark once fetched — fire-and-render separately so it never blocks
      // the rest of the app from painting.
      if (res.ok && res.data.clinicInfo && res.data.clinicInfo.logoFileId) {
        call('getPhotoUrl', session.token, res.data.clinicInfo.logoFileId, gsOpts({ quiet: true })).then(function (r) {
          state.master.logoUrl = r.data; render();
        });

    refreshPatientsSuggestCache();

  function patientNicknameSuffix(patientId) {

    var target = NAV.filter(function (n) { return n.id === screenId; })[0];

  function searchInputHtml(id, value, placeholder, oninputExpr, extraStyle) {

  /* ------------------------------------------------------------------ */
  /* Round 15 item 4 — generic "type, see suggestions, pick to load"      */
  /* search boxes. Every list-page search box used to reload its table's  */
  /* data on every keystroke (oninput -> debounced server call -> re-     */
  /* render). That's now split in two: typing only computes a small       */
  /* suggestion dropdown (client-side from an existing cache where one    */
  /* exists, otherwise a light pageSize:6 server lookup); the table only  */
  /* reloads once the user clicks a suggestion. Clearing the box back to  */
  /* empty is the one exception — there's nothing to "suggest" for an     */
  /* empty query, so that resets the table to unfiltered immediately,     */
  /* same as before. Pressing Enter also commits the typed text as-is     */
  /* (without requiring an exact suggestion match), as an escape hatch.   */
  /* ------------------------------------------------------------------ */
  function patientLikeSuggestions(q) {
    if (!state.suggestCache.patients) return null; // cache not ready yet this keystroke
    var ql = q.trim().toLowerCase(), qDigits = ql.replace(/[^\d]/g, '');
    return state.suggestCache.patients.filter(function (p) {
      var full = (p.firstName + ' ' + p.lastName).toLowerCase();
      return full.indexOf(ql) > -1 || (qDigits && String(p.phone).indexOf(qDigits) > -1);
    }).slice(0, 8).map(function (p) {
      return { id: p.id, primary: p.firstName + ' ' + p.lastName + (p.nickname ? ' (' + p.nickname + ')' : ''), secondary: p.phone, commitText: p.firstName + ' ' + p.lastName };
    });
  }
  /** Stock suggest-cache entries of one type ('supply' | 'medicine'). */
  function stockItemsOfType(type) {
    return (state.suggestCache.stock || []).filter(function (s) { return (s.type || 'supply') === type; });
  }
  function stockSuggestions(q) {
    if (!state.suggestCache.stock) return null;
    var ql = q.trim().toLowerCase();
    return stockItemsOfType(state.stock.type).filter(function (s) { return String(s.name).toLowerCase().indexOf(ql) > -1; })
      .slice(0, 8).map(function (s) { return { id: s.id, primary: s.name, secondary: s.category + (s.unit ? ' · ' + s.unit : ''), commitText: s.name }; });
  }
  function expenseSuggestionsAsync(q) {
    return call('listExpenses', session.token, { page: 1, pageSize: 6, filters: { q: q } }, gsOpts({ quiet: true })).then(function (res) {
      return ((res.data && res.data.items) || []).map(function (e) { return { id: e.id, primary: e.name, secondary: e.category + ' · ' + money(e.amount), commitText: e.name }; });
    });
  }
  function orderSuggestionsAsync(q) {
    return call('listOrders', session.token, { page: 1, pageSize: 6, filters: { q: q } }, gsOpts({ quiet: true })).then(function (res) {
      return ((res.data && res.data.items) || []).map(function (o) { return { id: o.id, primary: o.supplier, secondary: o.date + ' · ' + money(o.totalAmount), commitText: o.supplier }; });
    });
  }
  var SEARCH_SCOPES = {

  var searchSuggestSeq = 0; // guards a slow async suggestion response from clobbering a newer one

  function statCard(icon, label, value) {

    }).join('');
    return chartCard(title, bars || '<div class="empty-state">ไม่มีข้อมูล</div>');
  }
  /**
   * Donut ring drawn as stacked SVG <circle> strokes (the classic
   * stroke-dasharray/stroke-dashoffset technique) rather than a single
   * conic-gradient div — this is what lets each slice carry its own <title>
   * for a native hover tooltip (round 8 item 2: hovering the chart itself,
   * not just reading the legend, should show the label/value/percent).
   * Rotated -90deg so the first slice starts at 12 o'clock, matching the
   * previous conic-gradient's start point (conic-gradient's 0deg is "up").
   */
  function donutChart(title, rows) {
    var data = withPct(rows.map(function (r) { return { label: r.label, value: r.v }; }));
    var total = data.reduce(function (s, r) { return s + r.v; }, 0);
    var legend = data.map(function (r) {
      return '<div style="display:flex;align-items:center;gap:5px;font-size:11.5px;margin-bottom:5px" title="' + esc(r.label) + ': ' + esc(money(r.v)) + ' (' + pctLabel(r.pct) + ')">' +
        '<span style="width:8px;height:8px;border-radius:3px;background:' + r.color + ';display:inline-block;flex:none"></span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">' + esc(r.label) + '</span>' +
        '<b style="flex:none">' + pctLabel(r.pct) + '</b>' +
      '</div>';
    }).join('');
    var RING = 120, HOLE = 68;
    var strokeW = (RING - HOLE) / 2, radius = (RING + HOLE) / 4, cxy = RING / 2;
    var circumference = 2 * Math.PI * radius;
    var acc = 0;
    var slices = data.map(function (r) {
      var segLen = (r.pct / 100) * circumference;
      var dashoffset = -acc;
      acc += segLen;
      var tip = esc(r.label) + ': ' + esc(money(r.v)) + ' (' + pctLabel(r.pct) + ')';
      return '<circle cx="' + cxy + '" cy="' + cxy + '" r="' + radius + '" fill="none" stroke="' + r.color + '" stroke-width="' + strokeW +
        '" stroke-dasharray="' + segLen + ' ' + circumference + '" stroke-dashoffset="' + dashoffset + '"><title>' + tip + '</title></circle>';
    }).join('');
    var svg = data.length
      ? '<svg width="' + RING + '" height="' + RING + '" viewBox="0 0 ' + RING + ' ' + RING + '"><g transform="rotate(-90 ' + cxy + ' ' + cxy + ')">' + slices + '</g></svg>'
      : '<div style="width:' + RING + 'px;height:' + RING + 'px;border-radius:50%;background:var(--input-border)"></div>';
    var ring = '<div style="position:relative;width:' + RING + 'px;height:' + RING + 'px;flex:none">' +
      svg +
      '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:' + HOLE + 'px;text-align:center;padding:4px;pointer-events:none">' +
        (data.length ? '<span style="font-size:11.5px;font-weight:700;color:var(--text-2);line-height:1.25;word-break:break-word">' + money(total) + '</span>' : '') +
      '</div></div>';
    return chartCard(title, '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
      ring +
      '<div style="flex:1;min-width:140px">' + (legend || '<div class="empty-state">ไม่มีข้อมูล</div>') + '</div></div>');
  }
  function chartCard(title, body) {
    return '<div class="card" style="padding:16px;border:1px solid var(--border);border-radius:var(--r)">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:12px">' + esc(title) + '</div>' + body + '</div>';
  }
  var THAI_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  /** "2026-08" -> "2026-สิงหาคม" (yyyy-mmmm, full Thai month name). */
  function monthLabelFull(m) {
    var parts = String(m || '').split('-'), y = parts[0] || '', mm = Number(parts[1]) - 1;
    return y + '-' + (THAI_MONTHS_FULL[mm] || parts[1] || '');
  }
  /**
   * Combo chart: รายได้/ค่าใช้จ่าย as bars, กำไร as a line — Round 15 item 8.2
   * moved this from a dual-axis layout (bars against an implicit scale,
   * %กำไร against its own separate right-side axis) onto ONE shared money
   * axis, drawn on the left: กำไร (revenue − expense, in บาท) plots
   * directly against the same scale as the bars, so the line's position is
   * now directly comparable to bar height instead of floating on an
   * unrelated %-scale. minVal only drops below zero if a month actually
   * posted a loss — the common profitable case degenerates to the exact
   * same 0-at-bottom bar layout as before. The line's dots are plain HTML
   * circles (not SVG) positioned over the SVG polyline so they stay
   * perfectly round even though the SVG itself is stretched non-uniformly
   * to fill the card.
   */
  function monthlyTrendChart(rows) {
    var title = 'รายได้ VS ค่าใช้จ่าย VS กำไร รายเดือน';
    if (!rows || !rows.length) return chartCard(title, '<div class="empty-state">ไม่มีข้อมูล</div>');
    var n = rows.length;
    var allVals = [0];
    rows.forEach(function (r) { allVals.push(Number(r.revenue) || 0, Number(r.expense) || 0, Number(r.profit) || 0); });
    var maxVal = Math.max.apply(null, allVals);
    var minVal = Math.min.apply(null, allVals);
    if (maxVal === minVal) maxVal += 1;
    var totalRange = maxVal - minVal;
    var CH = 120, LABEL_H = 38, PAD_TOP = 10, BAR_W = 8, BAR_GAP = 2;
    var plotH = CH - PAD_TOP;
    var yPos = function (v) { return PAD_TOP + ((maxVal - v) / totalRange) * plotH; };
    var yZero = yPos(0);
    var bars = rows.map(function (r, i) {
      var leftPct = n > 1 ? ((i + 0.5) / n) * 100 : 50;
      var revTop = yPos(Number(r.revenue) || 0), expTop = yPos(Number(r.expense) || 0);
      return '' +
        '<div title="รายได้ ' + esc(monthLabelFull(r.month)) + ': ' + money(r.revenue) + '" style="position:absolute;left:calc(' + leftPct + '% - ' + (BAR_W + BAR_GAP / 2) + 'px);top:' + revTop + 'px;width:' + BAR_W + 'px;height:' + Math.max(0, yZero - revTop) + 'px;background:var(--green);border-radius:2px 2px 0 0"></div>' +
        '<div title="ค่าใช้จ่าย ' + esc(monthLabelFull(r.month)) + ': ' + money(r.expense) + '" style="position:absolute;left:calc(' + leftPct + '% + ' + (BAR_GAP / 2) + 'px);top:' + expTop + 'px;width:' + BAR_W + 'px;height:' + Math.max(0, yZero - expTop) + 'px;background:var(--pink);border-radius:2px 2px 0 0"></div>';
    }).join('');
    var points = rows.map(function (r, i) {
      var x = n > 1 ? ((i + 0.5) / n) * 1000 : 500;
      return x + ',' + yPos(Number(r.profit) || 0);
    }).join(' ');
    var dots = rows.map(function (r, i) {
      var leftPct = n > 1 ? ((i + 0.5) / n) * 100 : 50;
      var topPx = yPos(Number(r.profit) || 0);
      return '<div title="' + esc(monthLabelFull(r.month)) + ' · กำไร ' + money(r.profit) + '" style="position:absolute;left:' + leftPct + '%;top:' + topPx + 'px;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--navy,#2D4A6B);border:2px solid var(--surface)"></div>';
    }).join('');
    // Dashed zero-baseline — only drawn when it isn't simply the bottom
    // edge, i.e. only when at least one month actually posted a loss.
    var zeroLine = yZero < CH - 0.5
      ? '<div style="position:absolute;left:0;right:0;top:' + yZero + 'px;border-top:1px dashed var(--muted-4,#c9ccd6)"></div>' : '';
    var monthLabels = rows.map(function (r, i) {
      var leftPct = n > 1 ? ((i + 0.5) / n) * 100 : 50;
      return '<div style="position:absolute;left:' + leftPct + '%;top:0;font-size:9.5px;color:var(--muted);white-space:nowrap;transform:translateX(-50%) rotate(-40deg);transform-origin:top center">' + esc(monthLabelFull(r.month)) + '</div>';
    }).join('');
    var axisLeft = '<div style="position:relative;width:46px;height:' + CH + 'px;flex:none;font-size:9.5px;color:var(--muted);text-align:right">' +
      '<span style="position:absolute;top:-5px;right:6px">' + money(maxVal) + '</span>' +
      (minVal < 0 ? '<span style="position:absolute;bottom:-5px;right:6px">' + money(minVal) + '</span>'
        : '<span style="position:absolute;bottom:' + (CH - yZero - 5) + 'px;right:6px">฿ 0</span>') +
    '</div>';
    var legend = '<div style="display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end">' +
      '<span><span style="display:inline-block;width:8px;height:8px;background:var(--green);border-radius:2px;margin-right:4px;vertical-align:middle"></span>รายได้</span>' +
      '<span><span style="display:inline-block;width:8px;height:8px;background:var(--pink);border-radius:2px;margin-right:4px;vertical-align:middle"></span>ค่าใช้จ่าย</span>' +
      '<span><span style="display:inline-block;width:14px;height:2px;background:var(--navy,#2D4A6B);border-radius:1px;margin-right:4px;vertical-align:middle"></span>กำไร</span>' +
    '</div>';
    return '<div class="card" style="padding:16px;border:1px solid var(--border);border-radius:var(--r)">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap">' +
        '<div style="font-size:13px;font-weight:700">' + esc(title) + '</div>' + legend +
      '</div>' +
      '<div style="display:flex;gap:6px;align-items:flex-start">' +
        axisLeft +
        '<div style="position:relative;flex:1;min-width:0;height:' + (CH + LABEL_H) + 'px">' +
          '<div style="position:relative;width:100%;height:' + CH + 'px">' +
            zeroLine + bars +
            '<svg style="position:absolute;top:0;left:0;width:100%;height:' + CH + 'px;pointer-events:none" viewBox="0 0 1000 ' + CH + '" preserveAspectRatio="none">' +
              '<polyline points="' + points + '" fill="none" stroke="var(--navy,#2D4A6B)" stroke-width="2" vector-effect="non-scaling-stroke" />' +
            '</svg>' +
            dots +
          '</div>' +
          '<div style="position:relative;height:' + LABEL_H + 'px">' + monthLabels + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function patientsTemplate() {
    var L = state.patients.list;

    var rows = !L ? '<tr><td colspan="6" class="empty-state"><span class="spin"></span> กำลังโหลด...</td></tr>' :

  function fileToBase64Slice(file, start, end) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file.slice(start, end));
    });
  }
  /**
   * Round 17 item 4 (performance): downscale/re-compress an image client-
   * side before it ever gets uploaded. Patient and OPD photos come straight
   * off a phone camera — often 3000x4000px and several MB — and every later
   * view of that photo (getPhotoUrl, used by both the patient/record side
   * panels and the receipt/lightbox) base64-encodes the WHOLE file over
   * google.script.run; that round trip, not any DOM cost, is the biggest
   * real-world "ทำไมช้า" contributor in daily use. Resizing to a max 1600px
   * side and re-encoding as JPEG at 0.82 quality is more than enough for
   * on-screen viewing or a receipt-sized print, and typically cuts a
   * multi-MB camera photo down to a few hundred KB — smaller upload,
   * smaller Drive file, smaller/faster getPhotoUrl every time it's viewed
   * afterwards. Skips (resolves the original File untouched) for non-image
   * files, animated GIFs (canvas re-encoding would flatten the animation),
   * and anything already under DOWNSCALE_SKIP_BYTES, so a small screenshot
   * or already-optimized image isn't needlessly re-compressed. Also falls
   * back to the original file if decoding fails for any reason, or if the
   * re-encoded result somehow ends up LARGER than the original — this must
   * never make an upload worse, only better.
   */
  var DOWNSCALE_MAX_DIM = 1600;
  var DOWNSCALE_QUALITY = 0.82;
  var DOWNSCALE_SKIP_BYTES = 400 * 1024; // 400KB — not worth touching below this
  function downscaleImageFile(file) {
    if (!file || file.type.indexOf('image/') !== 0 || file.type === 'image/gif' || file.size <= DOWNSCALE_SKIP_BYTES) {
      return Promise.resolve(file);
    }
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (w <= DOWNSCALE_MAX_DIM && h <= DOWNSCALE_MAX_DIM) { resolve(file); return; }
          var scale = Math.min(DOWNSCALE_MAX_DIM / w, DOWNSCALE_MAX_DIM / h);
          var cw = Math.round(w * scale), ch = Math.round(h * scale);
          try {
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            canvas.toBlob(function (blob) {
              resolve((blob && blob.size < file.size) ? blob : file);
            }, 'image/jpeg', DOWNSCALE_QUALITY);
          } catch (e) { resolve(file); }
        };
        img.onerror = function () { resolve(file); };
        img.src = reader.result;
      };
      reader.onerror = function () { resolve(file); };
      reader.readAsDataURL(file);
    });
  }
  /**
   * Shared resumable chunk-upload driver: starts a session with the given
   * opts (merged with mimeType/fileSize), then PUTs 4MB slices one at a
   * time until the server reports done:true. onProgress(pct) fires after
   * every chunk. Resolves to the final fileId.
   */
  function chunkedUpload(file, startOpts, onProgress) {
    return call('startResumableUpload', session.token, Object.assign({ mimeType: file.type, fileSize: file.size }, startOpts))
      .then(function (res) {
        var sessionUrl = res.data.sessionUrl;
        var chunkSize = 4 * 1024 * 1024;
        var offset = 0;
        function nextChunk() {
          var end = Math.min(offset + chunkSize, file.size);
          return fileToBase64Slice(file, offset, end).then(function (b64) {
            return call('uploadFileChunk', session.token, sessionUrl, b64, offset, end - 1, file.size, gsOpts({ quiet: true }));
          }).then(function (chunkRes) {
            if (onProgress) onProgress(Math.round((end / file.size) * 100));
            if (chunkRes.data.done) return chunkRes.data.fileId;
            offset = end;
            return nextChunk();
          });
        }
        return nextChunk();
      });
  }

    if (!state.records.calData) loadCalendar();

    var cells = '';
    for (var i = 0; i < startDow; i++) cells += '<div class="cal-cell" style="min-height:80px;border:1px solid var(--border-lighter)"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var events = data[dateStr] || [];
      // Round 12 item 1.2: these were individually clickable (data-action="view-record")
      // opening the record panel directly; now they're plain, non-interactive
      // labels — clicking anywhere in the day cell (including on one of these)
      // only opens the day-summary panel via the cell's own "view-day" action.
      var evHtml = events.slice(0, 3).map(function (e) {
        return '<div style="font-size:10px;padding:2px 4px;border-radius:4px;background:' + (STATUS_COLOR[e.status] || 'var(--accent-soft)') + ';margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(e.patientName) + '</div>';

        '<div style="color:var(--muted);margin-bottom:3px">' + d + '</div>' + evHtml +
        (events.length > 3 ? '<div style="font-size:10px;color:var(--muted)">+' + (events.length - 3) + ' เพิ่มเติม</div>' : '') + '</div>';
    }
    var totalCells = startDow + daysInMonth;
    var trailing = (7 - (totalCells % 7)) % 7;
    for (var t = 0; t < trailing; t++) cells += '<div class="cal-cell" style="min-height:80px;border:1px solid var(--border-lighter)"></div>';
    var dow = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(function (x) { return '<div style="text-align:center;font-size:11px;color:var(--muted);padding:4px">' + x + '</div>'; }).join('');
    return '<div class="card" style="border:1px solid var(--border);border-radius:var(--r);padding:12px">' +

  /**
   * Client-side preview only — shows staff roughly how the customer amount
   * will split once saved. The server (computeRecordShares_ +
   * recomputeDoctorDayShares_) is always the authoritative calculation,
   * since the daily-minimum doctor top-up depends on every OTHER record
   * for that doctor+date and can't be known client-side.

  /**
   * Client-side preview only — mirrors computeRecordShares_ (round 13
   * formulas) so staff see roughly where the money will land once saved.
   * The server is always authoritative (daily-minimum top-up + the
   * server-trusted Promotions snapshot can't be known/verified client-side).
   */
  function previewShares(d) {
    var amount = Number(d.amount) || 0;
    var canula = d.useCanula ? (Number(d.canulaAmount) || 0) : 0;
    var doctor = (state.master.doctors || []).filter(function (x) { return x.id === d.doctorId; })[0];
    var sales = d.salesId ? (state.master.sales || []).filter(function (x) { return x.id === d.salesId; })[0] : null;
    var salesPct = sales ? (Number(sales.commissionRate) || 0) : 0;
    var doctorPct = doctor ? (Number(doctor.commissionPct) || 0) : 0;
    var promoAmount = 0, promoDoctorShare = 0;
    (d.usePromo ? (d.promoItems || []) : []).forEach(function (line) {
      var amt = Number(line.amount) || 0;
      promoAmount += amt;
      promoDoctorShare += amt * (Number(line.doctorSharePct) || 0) / 100;
    });
    promoAmount = Math.round(promoAmount * 100) / 100;
    promoDoctorShare = Math.round(promoDoctorShare * 100) / 100;
    var medicineAmount = (d.useMedicine ? (d.medicineItems || []) : []).reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    var otherAmount = (d.useOther ? (d.otherItems || []) : []).reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    var salesShare = Math.round((amount * salesPct / 100) * 100) / 100;
    var doctorShareRaw = Math.round((amount * doctorPct / 100 + promoDoctorShare) * 100) / 100;
    var estimatedRevenue = Math.round((amount + promoAmount + canula) * 100) / 100; // ประมาณการรายได้ = grossBase
    var clinicShare = Math.round((estimatedRevenue - salesShare - doctorShareRaw) * 100) / 100;
    var supplierPay = Math.round((medicineAmount + otherAmount) * 100) / 100; // จ่าย supplier
    return {
      salesShare: salesShare, doctorShareRaw: doctorShareRaw, clinicShare: clinicShare, doctor: doctor,
      estimatedRevenue: estimatedRevenue, supplierPay: supplierPay, totalNet: Math.round((estimatedRevenue + supplierPay) * 100) / 100
    };
  }

   * separate "ยอดส่วนแบ่งคลีนิค" (=clinicShare) row. This box renders that
   * breakdown (the 3 children + the separate clinic row); the "ประมาณการ
   * รายได้" (estimatedRevenue) line the old version showed is dropped from
   * display per the round-25 spec (still used internally — see
   * previewShares — since totalNet/clinicShare are derived from it, just
   * not surfaced as its own row here). This mirrors the SAME "headline
   * total + subtracted breakdown + separate net row" shape already used by
   * the day panel's round-19 ยอดสุทธิ section and the record detail panel's
   * round-19 ยอดสุทธิ row (see recordPanelTemplate above) — this is the last

  function sharePreviewInnerHtml(d) {

  /**

  /* ---- Record modal: ยา zone helpers ---- */
  var DISPENSE_COLS = 'minmax(180px,1fr) 92px 92px 96px 120px 116px 40px';
  function medicineStockItem(itemId) { return stockItemsOfType('medicine').filter(function (x) { return x.id === itemId; })[0]; }
  /**
   * ราคาขาย tier for `qty` units: {tier, price} of the largest tier <= qty
   * that has a price, else the smallest priced tier; {tier:null, price:null}
   * when the item has no sale prices at all.
   */
  function medicineTierFor(itemId, qty) {
    var s = medicineStockItem(itemId);
    var prices = (s && s.prices) || [];
    var pick = null, first = null;
    STOCK_PRICE_TIERS.forEach(function (t, i) {
      if (prices[i] == null) return;
      if (!first) first = { tier: t, price: prices[i] };
      if (t <= (Number(qty) || 0)) pick = { tier: t, price: prices[i] };
    });
    return pick || first || { tier: null, price: null };
  }
  function medicineUnitPrice(itemId, qty) { return medicineTierFor(itemId, qty).price; }
  /** The parts of a dispense row that change while typing, keyed by element-id prefix (see patchDispenseRow). */

    var warn = function (t) { return '<span style="color:var(--red-dark)">' + esc(t) + '</span>'; };

    return {
      dispNameCap: line.itemId ? esc(s ? (s.category || '') : '') : (String(line.name || '').trim() ? warn('เลือกยาจากรายการสต๊อก') : 'พิมพ์เพื่อค้นหายา'),
      dispQdCap: esc(unit),

  function dispenseTotalHtml(d) {
    return num((d.medicineItems || []).reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0));
  }
  function recalcDispenseLine(line) {
    if (!('qtyDispensed' in line)) return;
    var qd = Number(line.qtyDispensed) || 0, qu = Number(line.qtyUsed) || 0;
    line.qtyDeposit = Math.max(0, Math.round((qd - qu) * 100) / 100);
    line.amount = Math.round(qd * (Number(line.unitPrice) || 0) * 100) / 100;
  }
  /** Updates one dispense row's computed cells (and its ราคาต่อหน่วย input when auto-set) without a render, so the caret stays put. */

  /** Deposit choices for รายการใช้ยาฝาก. When editing a record, what it already used is still "available" to it. */
