<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALIN CLINIC · ระบบบริหารคลินิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
/* ===================== Design tokens ===================== */
:root{
  /* ===== Round 12 re-theme: navy + gold, matching the client's reference
     screenshot. Content area stays light/white; the sidebar gets its own
     dark-navy token set (--sidebar-*) below since it's a two-tone theme,
     not a single global palette flip. ===== */
  --bg:#F5F6FA; --surface:#FFFFFF;
  --border:#E4E8F1; --border-soft:#ECEFF6; --border-lighter:#F1F3F9; --sidebar-border:#16244A; --input-border:#DCE1EC;
  --input-bg:#F7F8FC; --hover-bg:#F0F2F9; --hover-bg2:#E7EBF5;
  --text:#1C2440; --text-2:#3D4568; --text-3:#2A3253; --muted:#8891AC; --muted-2:#6C7595; --muted-3:#A6ADC5; --muted-4:#B8BED2; --icon-muted:#98A0BC;
  --accent:#1E3A72; --accent-hover:#16295A; --accent-soft:#E9EDF7; --accent-soft2:#F1F3FA;
  --gold:#C9A961; --gold-dark:#AD8C46; --gold-soft:#F8F1DE;
  --green:#4E9D6E; --green-dark:#357552; --green-soft:#E7F5EC; --olive:#8FBF7A;
  --pink:#C0709A; --pink-dark:#95547A; --pink-soft:#F6E9F0;
  --red:#D1585A; --red-dark:#AC4143; --red-soft:#FBEBEB;
  --amber-dark:#B4791E; --amber-soft:#FBF1DE;
  --r:14px; --r-sm:9px; --r-lg:16px;
  /* Sidebar-only tokens (dark navy chrome, light-on-dark text) */
  --sidebar-bg:#0F1B3D; --sidebar-bg-2:#0B1530; --sidebar-active-bg:rgba(255,255,255,.08);
  --sidebar-text:#E7EAF5; --sidebar-text-muted:#8993B8; --sidebar-hover-bg:rgba(255,255,255,.05);
  --sidebar-border-soft:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Noto Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
button,input,textarea,select{font-family:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;vertical-align:middle}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#DCE1EC;border-radius:8px;border:3px solid var(--bg)}
::selection{background:var(--accent-soft)}

/* ===================== Layout ===================== */
.app-shell{display:flex;min-height:100vh;background:var(--bg);color:var(--text)}
.sidebar{width:250px;flex:none;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:52px;height:52px;border-radius:13px;background:var(--gold);color:var(--sidebar-bg);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:.5px}
.brand-name{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.4px}
.brand-sub{font-size:11px;color:var(--sidebar-text-muted);font-weight:300}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .15s;color:var(--sidebar-text-muted)}
.nav-item:hover{background:var(--sidebar-hover-bg)}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-text)}
.nav-item:not(.active){color:var(--sidebar-text-muted)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.side-label{font-size:10.5px;color:var(--sidebar-text-muted);letter-spacing:.8px;padding:0 12px;font-weight:500}
.preview-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500}
.preview-item:hover{background:var(--sidebar-hover-bg)}
.preview-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-text)}
.preview-item:not(.active){color:var(--sidebar-text-muted)}
.user-wrap{position:relative}
.user-card{background:var(--sidebar-hover-bg);border:1px solid var(--sidebar-border-soft);border-radius:12px;padding:12px 13px;display:flex;gap:10px;align-items:center;cursor:pointer}
.user-card:hover{background:var(--sidebar-active-bg)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--sidebar-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.user-menu{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 34px rgba(15,27,61,.22);overflow:hidden;z-index:20}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:11px 13px;font-size:12.5px;color:var(--text-2);cursor:pointer;border-bottom:1px solid var(--border-lighter)}
.user-menu-item:last-child{border-bottom:none;color:var(--red-dark)}
.user-menu-item:hover{background:var(--input-bg)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:16px;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:5}
.page-title{font-size:19px;font-weight:600;color:var(--text);letter-spacing:.2px}
.page-sub{font-size:12px;color:var(--muted);font-weight:300;margin-top:2px}
.header-chip{display:flex;align-items:center;gap:8px;background:var(--hover-bg);border:1px solid var(--input-border);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.icon-square{width:37px;height:37px;border-radius:10px;background:var(--hover-bg);border:1px solid var(--input-border);display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;position:relative;flex:none}
.icon-square:hover{background:var(--hover-bg2)}
.dot-badge{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.content{padding:26px 32px 48px;display:flex;flex-direction:column;gap:22px}

/* ===================== Reusable bits ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,27,61,.04)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{border-color:var(--input-border);color:var(--text-2);background:var(--surface)}
.btn-outline:hover{background:var(--hover-bg)}
.btn-ghost{color:var(--text-2);cursor:pointer}
.icon-btn{font-size:17px;padding:7px;border-radius:8px;cursor:pointer;display:inline-flex}
.icon-btn.edit{color:var(--accent);background:var(--hover-bg)}
.icon-btn.del{color:var(--red);background:var(--red-soft)}
.icon-btn.print{color:var(--green);background:var(--green-soft)}
.table{width:100%;border-collapse:collapse}
.table thead tr{background:var(--input-bg)}
.table th{text-align:left;padding:12px 20px;font-size:11.5px;font-weight:500;color:var(--muted)}
.table td{padding:13px 20px;font-size:13px;color:var(--text)}
.table tbody tr{border-top:1px solid var(--border-lighter)}
.table tbody tr:hover{background:#F6F7FC}
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:500}
.badge-tag{font-size:11.5px;background:var(--border-soft);color:var(--text-2);padding:4px 10px;border-radius:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text-2)}
.field .req{color:var(--red-dark)}
.input,.select-fake,textarea.input{border:1px solid var(--input-border);background:var(--input-bg);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--accent)}
.input-wrap{display:flex;align-items:center;gap:9px;border:1px solid var(--input-border);background:var(--input-bg);border-radius:var(--r-sm);padding:9px 13px}
.input-wrap input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);width:100%}
.select-fake{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;color:var(--text)}
.dropdown{position:relative}
.dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--input-border);border-radius:11px;box-shadow:0 12px 28px rgba(15,27,61,.14);overflow:hidden;z-index:30;min-width:210px}
.dropdown-panel.up{top:auto;bottom:calc(100% + 6px)}
.dropdown-option{display:flex;align-items:center;gap:9px;padding:10px 13px;font-size:12.5px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border-lighter);white-space:nowrap}
.dropdown-option:last-child{border-bottom:none}
.dropdown-option:hover{background:var(--input-bg)}
.dropdown-option .ms{font-size:16px;color:var(--accent)}
.tab-row{display:flex;gap:26px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab-item{display:flex;align-items:center;gap:8px;padding:0 2px 12px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-item.active{color:var(--accent);border-color:var(--accent)}
.pill-toggle{display:flex;background:var(--border-soft);border-radius:10px;padding:3px}
.pill-toggle .item{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted-2)}
.pill-toggle .item.active{background:var(--surface);color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--muted)}
.pager-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--input-border);color:var(--text-2)}
.pager-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.placeholder-box{border:1px dashed var(--muted-4);background:repeating-linear-gradient(45deg,var(--hover-bg),var(--hover-bg) 6px,var(--border-soft) 6px,var(--border-soft) 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}

/* ===================== Overlays ===================== */
.overlay{position:fixed;inset:0;background:rgba(15,27,61,.28);z-index:35;display:flex;justify-content:flex-end}
.overlay.center{background:rgba(15,27,61,.34);z-index:40;justify-content:center;align-items:flex-start;padding:48px 20px;overflow-y:auto}
.panel{background:var(--surface);height:100%;box-shadow:-14px 0 44px rgba(15,27,61,.16);display:flex;flex-direction:column}
.panel-head{display:flex;align-items:flex-start;gap:14px;padding:22px 24px;border-bottom:1px solid var(--border-soft);background:#F6F7FC}
.panel-close{font-size:20px;color:var(--muted);cursor:pointer;padding:4px}
.panel-body{flex:1;overflow-y:auto;padding:18px 24px 26px;display:flex;flex-direction:column;gap:11px}
.panel-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 24px;border-top:1px solid var(--border-soft);background:#F6F7FC}
.modal{width:100%;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(15,27,61,.22);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-soft)}
.modal-title{font-size:15.5px;font-weight:600;color:var(--text)}
.modal-sub{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:16px;max-height:66vh;overflow-y:auto}
.modal-foot{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--border-soft);background:#F6F7FC}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid-fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.line-row{display:grid;gap:10px;align-items:center}

/* ===================== Toast ===================== */
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:#FDFBF8;padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);animation:toastIn .25s ease forwards}
@keyframes toastIn{to{opacity:1;transform:translateY(0)}}

/* ===================== Dashboard specifics ===================== */
.stat-card{padding:16px 17px;display:flex;flex-direction:column;gap:11px}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:12px;color:var(--muted);font-weight:400}
.stat-value{font-size:23px;font-weight:600;color:var(--text);letter-spacing:-.3px}
.stat-trend{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500}
.chart-card{padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted-2)}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.bars{position:relative;height:230px;margin-top:2px}
.bars-grid{position:absolute;inset:0 0 22px 0;display:flex;flex-direction:column;justify-content:space-between}
.bars-grid i{border-top:1px dashed var(--border)}
.bars-grid i:last-child{border-top:1px solid var(--border)}
.bars-cols{position:absolute;inset:0 0 22px 0;display:flex;align-items:flex-end;gap:14px}
.bars-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bars-col-inner{width:100%;display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.bars-labels{position:absolute;left:0;right:0;bottom:0;display:flex;gap:14px}
.bars-labels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:22px;flex:1;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.donut-hole{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-rows{display:flex;flex-direction:column;gap:9px;flex:1 1 150px;min-width:150px}
.donut-row{display:flex;align-items:center;gap:9px;font-size:12px}
.bar-rows{display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1}
.bar-row-top{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)}
.bar-track{height:9px;border-radius:6px;background:var(--border-soft);overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.chart-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:stretch}
.chart-row{border-top:1px solid var(--border);padding-top:22px}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red-dark,#C0504D);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;animation:navPulse 1.6s ease-in-out infinite}
@keyframes navPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,80,77,.5)}50%{box-shadow:0 0 0 6px rgba(192,80,77,0)}}
.board-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.board-cols{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto}
.chart-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chart-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ===================== Calendar ===================== */
.cal-wrap{flex:1 1 620px;min-width:0;padding:20px;height:calc(100vh - 208px);min-height:480px;display:flex;flex-direction:column}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav{display:flex;gap:6px}
.cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:6px}
.cal-day{min-height:0;overflow:hidden;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:1px solid var(--border-soft)}
.cal-day:hover{border-color:var(--accent)}
.cal-day .n{font-size:12px;font-weight:500}
.cal-evt{font-size:9.5px;border-radius:5px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-more{font-size:9.5px;color:var(--muted);padding-left:2px}
.agenda-wrap{flex:1 1 280px;max-width:340px;min-width:280px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;height:calc(100vh - 208px);min-height:480px;overflow-y:auto}
.agenda-item{display:flex;gap:12px;padding:11px;border-radius:11px;background:var(--input-bg);border:1px solid var(--border-soft)}

/* ===================== Login ===================== */
.login-shell{min-height:100vh;display:grid;grid-template-columns:3fr 1fr;background:var(--bg)}
.login-art{background:var(--accent-soft);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:48px 52px;overflow:hidden}
.login-art>*{position:relative}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px}
.login-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:20px}
.strength-bar{display:flex;gap:5px;margin-top:3px}
.strength-bar i{flex:1;height:4px;border-radius:3px;display:block;background:var(--input-border)}
@media (max-width:880px){
  .login-shell{grid-template-columns:1fr}
  .login-art{display:none}
}

/* ===================== Receipt ===================== */
.receipt{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 26px rgba(15,27,61,.10);padding:40px 44px;display:flex;flex-direction:column;gap:26px;margin:0 auto}
.receipt table{width:100%;border-collapse:collapse}
.receipt th{text-align:left;padding:9px 0;font-size:11px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--border)}
.receipt td{padding:11px 0;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border-lighter)}
@media print{
  .sidebar,.header,.no-print{display:none !important}
  .content{padding:0}
  body{background:#fff}
}

/* ===================== Responsive ===================== */
@media (max-width:1000px){
  .sidebar{width:72px;padding:16px 8px}
  .brand-name,.brand-sub,.nav-item span:not(.ms),.preview-item span:not(.ms),.side-label,.user-info{display:none}
  .nav-item,.preview-item{justify-content:center}
  .user-card{justify-content:center}
}
@media (max-width:1100px){
  .chart-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .board-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board-cols{grid-template-columns:1fr}
  .chart-grid,.chart-2,.chart-3{grid-template-columns:1fr}
  .header{padding:14px 14px}
  .content{padding:16px 14px 40px}
  .page-title,.page-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-chip{display:none}
  .grid-fit{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}

/* ===================== Extras: spinner / toast(Swal) / portal dropdown / pagination ===================== */
.gs-loading-overlay{position:fixed;inset:0;background:rgba(245,246,250,.7);z-index:9999;display:none;align-items:center;justify-content:center}
.gs-loading-overlay.on{display:flex}
.gs-loading-overlay .spin-lg{width:46px;height:46px;border-radius:50%;border:4px solid rgba(30,58,114,.20);border-top-color:var(--accent);animation:gs-spin .7s linear infinite}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(30,58,114,.20);border-top-color:var(--accent);animation:gs-spin .7s linear infinite;vertical-align:middle}
.btn .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff;margin-right:6px}
@keyframes gs-spin{to{transform:rotate(360deg)}}

          '<span style="flex:none;font-size:11.5px;color:' + (o.subWarn ? 'var(--red-dark)' : 'var(--muted)') + '">' + esc(o.sub) + '</span></div>';
      }
      return '<div class="opt' + active + '" data-portal-pick="' + esc(o.value) + '">' + esc(o.label) + '</div>';
    }).join('') || '<div class="opt" style="color:var(--muted)">ไม่มีตัวเลือก</div>';
    portalEl.classList.add('open');
    positionPortal();
  }
  function positionPortal() {
    if (!state.portal) return;
    var trigger = document.getElementById(state.portal.triggerId);
    if (!trigger) { closePortal(); return; }
    var r = trigger.getBoundingClientRect();
    var estHeight = Math.min(260, (state.portal.options.length || 1) * 38 + 8);
    var roomBelow = window.innerHeight - r.bottom;
    var openUpward = roomBelow < estHeight + 12 && r.top > estHeight + 12;
    portalEl.style.left = Math.min(r.left, window.innerWidth - 220) + 'px';
    if (openUpward) {
      portalEl.style.top = 'auto';
      portalEl.style.bottom = (window.innerHeight - r.top + 6) + 'px';
    } else {
      portalEl.style.bottom = 'auto';
      portalEl.style.top = (r.bottom + 6) + 'px';
    }
    portalEl.style.width = Math.max(r.width, 180) + 'px';
  }
  window.addEventListener('resize', positionPortal);
  window.addEventListener('scroll', positionPortal, true);

  /* ---------------------------------------------------------------- */
  /* Pagination helper — renders controls for a {page,pages,total} blob   */
  /* ---------------------------------------------------------------- */
  function pagerHtml(pageInfo, action, key) {
    if (!pageInfo || pageInfo.pages <= 1) return '';
    var p = pageInfo.page, n = pageInfo.pages;
    var arg = function (page) { return key ? key + ':' + page : page; };
    var btns = '';
    btns += '<button data-action="' + action + '" data-arg="' + arg(p - 1) + '"' + (p <= 1 ? ' disabled' : '') + '><span class="ms">chevron_left</span></button>';
    var startP = Math.max(1, p - 2), endP = Math.min(n, p + 2);
    for (var i = startP; i <= endP; i++) {
      btns += '<button data-action="' + action + '" data-arg="' + arg(i) + '"' + (i === p ? ' class="active"' : '') + '>' + i + '</button>';
    }
    btns += '<button data-action="' + action + '" data-arg="' + arg(p + 1) + '"' + (p >= n ? ' disabled' : '') + '><span class="ms">chevron_right</span></button>';
    return '<div class="pager"><span>ทั้งหมด ' + pageInfo.total + ' รายการ</span>' + btns + '</div>';
  }

  /* Client-side paging for tables whose rows are already loaded (same 15
   * rows per page as the server-paged lists, CONFIG.PAGE_SIZE_DEFAULT). */
  var LOCAL_PAGE_SIZE = 15;
  function localPage(items, page) {
    var total = items.length, pages = Math.max(1, Math.ceil(total / LOCAL_PAGE_SIZE));
    page = Math.min(Math.max(1, Number(page) || 1), pages);
    var start = (page - 1) * LOCAL_PAGE_SIZE;
    return { items: items.slice(start, start + LOCAL_PAGE_SIZE), page: page, pages: pages, total: total };
  }
  // Where each locally paged table keeps its page number, and how it redraws.
  var LOCAL_PAGERS = {
    patientRecords: { holder: function () { return state.patients.panel; }, field: 'recPage', draw: function () { renderPatientPanel(); } },
    patientDeposits: { holder: function () { return state.patients.panel; }, field: 'depPage', draw: function () { renderPatientPanel(); } },
    stockLog: { holder: function () { return state.stock.panel; }, field: 'page', draw: function () { renderStockPanel(); } },
    report: { holder: function () { return state.report; }, field: 'page', draw: function () { render(); } },
    deposits: { holder: function () { return state.deposits; }, field: 'page', draw: function () { render(); } },
    procedures: { holder: function () { return state.stock; }, field: 'procPage', draw: function () { render(); } },
    promotions: { holder: function () { return state.promotions; }, field: 'page', draw: function () { render(); } },
    staff: { holder: function () { return state.settings; }, field: 'staffPage', draw: function () { render(); } }
  };
  function localPagerHtml(info, key) { return pagerHtml(info, 'local-page', key); }
  function setLocalPage(arg) {
    var i = String(arg).lastIndexOf(':');
    var pg = LOCAL_PAGERS[String(arg).slice(0, i)];
    var h = pg && pg.holder();
    if (!h) return;
    h[pg.field] = Number(String(arg).slice(i + 1));
    pg.draw();
  }

  /** Round 19 item 2: wraps a list page's `.card` table in a dim-in-place
   *  transition while a dropdown-filter reload is in flight, instead of the
   *  old behavior (table frozen with zero feedback, then an abrupt full
   *  content swap once the new data landed) — the previously-rendered rows
   *  stay visible (just faded + non-interactive) so the reload reads as a
   *  smooth in-place update rather than a jarring snap. Used by
   *  recordsListView/stockTemplate/expenseTabView/orderTabView. */
  function listCardWrap(tableHtml, isReloading) {
    return '<div class="card" style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:relative;transition:opacity .18s ease;' +
      (isReloading ? 'opacity:.45;pointer-events:none' : 'opacity:1') + '">' +
      (isReloading ? '<div style="position:absolute;top:10px;right:12px;z-index:2"><span class="spin"></span></div>' : '') +
      tableHtml +
    '</div>';
  }

            (state.loginError ? '<div style="background:var(--red-soft);color:var(--red-dark);font-size:12.5px;padding:9px 12px;border-radius:var(--r-sm)">' + esc(state.loginError) + '</div>' : '') +

  function doLogin() {
    var u = document.getElementById('loginUsername').value.trim();
    var p = document.getElementById('loginPassword').value;
    if (!u || !p || state.loginBusy) return;
    state.loginBusy = true; state.loginError = ''; render();
    call('login', u, p, gsOpts({ quiet: true })).then(function (res) {
      state.loginBusy = false;
      if (!res.ok) { state.loginError = res.message || 'เข้าสู่ระบบไม่สำเร็จ'; render(); return; }
      session = { token: res.token, user: res.user };
      persistSession();
      afterLogin();
    }, function (err) {
      state.loginBusy = false; state.loginError = (err && err.message) || 'เข้าสู่ระบบไม่สำเร็จ'; render();
    });
  }

  function afterLogin() {
    // Round 18 item 2: Dashboard is now admin-only (see NAV's `adminOnly`
    // flags) — a staff session can't land on a screen its own sidebar never
    // shows a button for, so it lands on the first screen it IS allowed to
    // see instead (บันทึกการรักษา, currently — recomputed from `allowedNav()`
    // rather than hardcoded, so this stays correct if the admin-only set
    // ever changes).
    state.screen = isAdmin() ? 'dash' : allowedNav()[0].id;
    // บันทึกการรักษา opens on the doctor's list for staff (พบแพทย์), on everything for admin.
    state.records.visitStatus = isAdmin() ? '' : 'with_doctor';
    call('getMasterData', session.token, gsOpts({ quiet: true })).then(function (res) {
      if (res.ok) state.master = res.data;
      render();
      pollQueueAlerts();
      if (state.screen === 'dash') loadDash();
      // Clinic logo (Settings > ข้อมูลบริษัท) shows in the sidebar brand
      // mark once fetched — fire-and-render separately so it never blocks
      // the rest of the app from painting.
      if (res.ok && res.data.clinicInfo && res.data.clinicInfo.logoFileId) {
        call('getPhotoUrl', session.token, res.data.clinicInfo.logoFileId, gsOpts({ quiet: true })).then(function (r) {
          state.master.logoUrl = r.data; render();
        });
      }
    }, function () { render(); });
    // Seed the dropdown/suggestion caches once on first load; they're only
    // re-fetched later when the underlying patient/stock data changes.
    refreshPatientsSuggestCache();
    refreshStockSuggestCache();
  }
  function refreshPatientsSuggestCache() {
    return call('listAllPatientsLite', session.token, gsOpts({ quiet: true })).then(function (res) {
      if (res.ok) { state.suggestCache.patients = res.data; render(); }
    });
  }
  /** Round 15 item 1.2: "ชื่อเล่น" suffix — e.g. " (แนน)" — for a patientId,
   *  looked up from the already-loaded patients suggest-cache so no extra
   *  server round-trip is needed. Empty string if not found/no nickname. */
  function patientNicknameSuffix(patientId) {
    if (!patientId || !state.suggestCache.patients) return '';
    var p = state.suggestCache.patients.filter(function (x) { return x.id === patientId; })[0];
    return (p && p.nickname) ? ' <span style="color:var(--muted);font-weight:400">(' + esc(p.nickname) + ')</span>' : '';
  }
  function refreshStockSuggestCache() {
    return call('listAllStockLite', session.token, gsOpts({ quiet: true })).then(function (res) {
      if (res.ok) state.suggestCache.stock = res.data;
    });
  }

  function doLogout() {
    call('logout', session.token, gsOpts({ quiet: true })).then(resetToLogin, resetToLogin);
  }
  function resetToLogin() {
    clearSession();
    state.screen = 'login'; state.master = null;
    render();
  }

  function goNav(screenId) {
    // Round 18 item 2: defensive guard — the sidebar never renders a button
    // for an adminOnly screen to a staff session (see allowedNav()), so this
    // should be unreachable in normal use, but refusing it here too means a
    // staff session can never end up on a hidden screen no matter what
    // triggers the nav change.
    var target = NAV.filter(function (n) { return n.id === screenId; })[0];
    if (target && target.adminOnly && !isAdmin()) return;
    state.screen = screenId;
    if (screenId !== 'stock' && state.stock.panel) closeStockPanel();
    if (screenId !== 'deposits' && state.deposits.panel) { state.deposits.panel = null; renderDepositPanel(); }
    render();
    // Screens fed by other screens' writes (dashboard, records, stock, withdrawals) reload on every visit;
    // the previous data stays on screen until the new one lands.
    if (screenId === 'dash') loadDash();
    if (screenId === 'patients' && !state.patients.list) loadPatients();
    if (screenId === 'records') { loadRecords(); if (state.records.view === 'calendar') loadCalendar(); }
    if (screenId === 'stock') { if (state.stock.type === 'procedure') { if (!state.stock.procedures) loadProcedures(); } else loadStock(); }
    if (screenId === 'withdraw') loadWithdrawals();
    if (screenId === 'board') { loadBoard(); clearQueueAlerts(); pollQueueAlerts(); }
    else pollQueueAlerts(); // look for newly รอชำระเงิน customers whenever the screen changes
    if (screenId === 'deposits') loadDeposits(); // always fresh: records/withdrawals elsewhere change it
    if (screenId === 'expense' && !state.expense.list) loadExpenses();
    if (screenId === 'promotions' && !state.promotions.list) loadPromotions();
    if (screenId === 'settings') loadSettingsTabData(state.settings.tab);
  }

  function tabBar(tabs, activeId, action) {

      return '<button type="button" class="tab-item' + (activeId === t.id ? ' active' : '') + '" data-action="' + esc(action) + '" data-arg="' + esc(t.id) + '">' + esc(t.label) + '</button>';

  /**
   * A text input with a leading search (magnifying-glass) icon — used for

   * modal, the list-page search bars) so they read consistently as search
   * fields rather than plain text inputs. `oninputExpr` is the raw JS
   * expression string for the input's oninput= attribute (matches the
   * existing window.__valin.on...(this.value) pattern used elsewhere).
   */
  function searchInputHtml(id, value, placeholder, oninputExpr, extraStyle) {
    return '<div class="search-input-wrap"' + (extraStyle ? ' style="' + extraStyle + '"' : '') + '>' +
      '<span class="ms search-ic">search</span>' +
      '<input type="text"' + (id ? ' id="' + esc(id) + '"' : '') + ' placeholder="' + esc(placeholder) + '" value="' + esc(value || '') + '" oninput="' + esc(oninputExpr) + '" style="' + inputStyle + '">' +

  /* ------------------------------------------------------------------ */
  /* Round 15 item 4 — generic "type, see suggestions, pick to load"      */
  /* search boxes. Every list-page search box used to reload its table's  */
  /* data on every keystroke (oninput -> debounced server call -> re-     */
  /* render). That's now split in two: typing only computes a small       */
  /* suggestion dropdown (client-side from an existing cache where one    */
  /* exists, otherwise a light pageSize:6 server lookup); the table only  */
  /* reloads once the user clicks a suggestion. Clearing the box back to  */
  /* empty is the one exception — there's nothing to "suggest" for an     */
  /* empty query, so that resets the table to unfiltered immediately,     */
  /* same as before. Pressing Enter also commits the typed text as-is     */
  /* (without requiring an exact suggestion match), as an escape hatch.   */
  /* ------------------------------------------------------------------ */
  /** Name, phone digits or HN match — same rule as patientMatcher_ on the server. */
  function patientMatches(p, q) {
    var ql = String(q || '').trim().toLowerCase(), qDigits = ql.replace(/[^\d]/g, '');
    var full = (p.firstName + ' ' + p.lastName).toLowerCase();
    return full.indexOf(ql) > -1 || (qDigits && String(p.phone).indexOf(qDigits) > -1) || (p.hn && String(p.hn).toLowerCase().indexOf(ql) > -1);
  }
  function patientLikeSuggestions(q) {
    if (!state.suggestCache.patients) return null; // cache not ready yet this keystroke

  function donutChart(title, rows) {

  function fileToBase64Slice(file, start, end) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file.slice(start, end));
    });
  }
  /**
   * Round 17 item 4 (performance): downscale/re-compress an image client-
   * side before it ever gets uploaded. Patient and OPD photos come straight
   * off a phone camera — often 3000x4000px and several MB — and every later
   * view of that photo (getPhotoUrl, used by both the patient/record side
   * panels and the receipt/lightbox) base64-encodes the WHOLE file over
   * google.script.run; that round trip, not any DOM cost, is the biggest
   * real-world "ทำไมช้า" contributor in daily use. Resizing to a max 1600px
   * side and re-encoding as JPEG at 0.82 quality is more than enough for
   * on-screen viewing or a receipt-sized print, and typically cuts a
   * multi-MB camera photo down to a few hundred KB — smaller upload,
   * smaller Drive file, smaller/faster getPhotoUrl every time it's viewed
   * afterwards. Skips (resolves the original File untouched) for non-image
   * files, animated GIFs (canvas re-encoding would flatten the animation),
   * and anything already under DOWNSCALE_SKIP_BYTES, so a small screenshot
   * or already-optimized image isn't needlessly re-compressed. Also falls
   * back to the original file if decoding fails for any reason, or if the
   * re-encoded result somehow ends up LARGER than the original — this must
   * never make an upload worse, only better.
   */
  var DOWNSCALE_MAX_DIM = 1600;
  var DOWNSCALE_QUALITY = 0.82;
  var DOWNSCALE_SKIP_BYTES = 400 * 1024; // 400KB — not worth touching below this
  function downscaleImageFile(file) {
    if (!file || file.type.indexOf('image/') !== 0 || file.type === 'image/gif' || file.size <= DOWNSCALE_SKIP_BYTES) {
      return Promise.resolve(file);
    }
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (w <= DOWNSCALE_MAX_DIM && h <= DOWNSCALE_MAX_DIM) { resolve(file); return; }
          var scale = Math.min(DOWNSCALE_MAX_DIM / w, DOWNSCALE_MAX_DIM / h);
          var cw = Math.round(w * scale), ch = Math.round(h * scale);
          try {
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            canvas.toBlob(function (blob) {
              resolve((blob && blob.size < file.size) ? blob : file);
            }, 'image/jpeg', DOWNSCALE_QUALITY);
          } catch (e) { resolve(file); }
        };
        img.onerror = function () { resolve(file); };
        img.src = reader.result;
      };
      reader.onerror = function () { resolve(file); };
      reader.readAsDataURL(file);
    });
  }
  /**
   * Shared resumable chunk-upload driver: starts a session with the given
   * opts (merged with mimeType/fileSize), then PUTs 4MB slices one at a
   * time until the server reports done:true. onProgress(pct) fires after
   * every chunk. Resolves to the final fileId.
   */
  function chunkedUpload(file, startOpts, onProgress) {
    return call('startResumableUpload', session.token, Object.assign({ mimeType: file.type, fileSize: file.size }, startOpts))
      .then(function (res) {
        var sessionUrl = res.data.sessionUrl;
        var chunkSize = 4 * 1024 * 1024;
        var offset = 0;
        function nextChunk() {
          var end = Math.min(offset + chunkSize, file.size);
          return fileToBase64Slice(file, offset, end).then(function (b64) {
            return call('uploadFileChunk', session.token, sessionUrl, b64, offset, end - 1, file.size, gsOpts({ quiet: true }));
          }).then(function (chunkRes) {
            if (onProgress) onProgress(Math.round((end / file.size) * 100));
            if (chunkRes.data.done) return chunkRes.data.fileId;
            offset = end;
            return nextChunk();
          });
        }
        return nextChunk();
      });
  }

  /** Round 18 item 1: toggles one summary row's expanded/collapsed state.
   *  Round 20 item 1: this used to call renderDayPanel() (a full innerHTML
   *  replace of the whole panel) on every toggle — the browser destroys and
   *  recreates every row's DOM node each time, which reads as a "flicker"
   *  (no animation plays, and any hover/scroll state on the panel resets),
   *  instead of the requested smooth "toggle down" reveal. Now this only
   *  touches the ONE row being toggled directly via the DOM (see
   *  daySummaryItem(), which always renders the detail wrapper — collapsed
   *  via CSS `max-height:0` — instead of omitting it when collapsed), so a
   *  CSS transition on that wrapper's max-height/opacity can actually
   *  animate, and every other row's DOM node (and the page's scroll
   *  position) is left completely untouched. `dp.expanded[key]` is still
   *  kept in sync so a subsequent full re-render (reopening the panel,
   *  finishing a LINE send, etc.) reflects the correct open/closed state. */
  function toggleDaySection(key) {
    var dp = state.records.dayPanel;
    if (!dp) return;
    var nowExpanded = !dp.expanded[key];
    dp.expanded[key] = nowExpanded;
    var wrap = dayPanelEl.querySelector('[data-day-detail="' + key + '"]');
    if (!wrap) { renderDayPanel(); return; } // safety net if the DOM ever gets out of sync
    if (nowExpanded) {
      wrap.classList.add('day-detail-open');
      wrap.style.maxHeight = wrap.scrollHeight + 'px';
    } else {
      // Set an explicit starting height (it may currently be an unset/'none'
      // value from the open state above) before dropping to 0, so the
      // browser has two concrete pixel values to transition between instead
      // of snapping instantly.
      wrap.style.maxHeight = wrap.scrollHeight + 'px';
      void wrap.offsetHeight; // force a reflow so the browser registers the height above before the next change
      wrap.style.maxHeight = '0px';
      wrap.classList.remove('day-detail-open');

      '</div>' : '') +

  function dayPanelTemplate() {

    // Round 18 item 1: itemized "Pro A (x1)" rows from the new promoItems

    var promoDetail = s.promoItems && s.promoItems.length

    var otherDetail = (s.medicineItems.length || s.otherItems.length)

    // net take (ClinicShare sum) — explicitly defined by the client as
    // ยอดสุทธิ = จำนวนเงินทั้งหมด - ส่วนแบ่งแพทย์ - ส่วนแบ่งเซลล์ (there is no
    // supplier share any more). Numerically this is exactly s.clinicNet (see

    // redundant now that the headline itself IS ส่วนแบ่งคลีนิค).
    var netDetail = dayPanelRow('จำนวนเงินที่รับชำระมาทั้งหมด', dayMoney(s.totalCollected), { tight: true }) +
      dayPanelRow('− ส่วนแบ่งแพทย์', dayMoney(s.doctorTotal), { tight: true }) +
      dayPanelRow('− ส่วนแบ่งเซลล์', dayMoney(s.salesTotal), { tight: true });
    var netPositive = s.clinicNet >= 0;

  /** A patient made while dispensing is "ชื่อ (รออัพเดท)" until its history is filled in (see createPendingPatient_ in Code.gs). */
  var PENDING_NAME_TAG = '(รออัพเดท)';
  function isPendingName(name) { return String(name || '').indexOf(PENDING_NAME_TAG) > -1; }
  var onPatientSuggestSearch = debounce(function (q) {
    state.draft._patientQuery = q;
    // จัดยา-เบิกยา: typing again after picking someone means a different (or new) patient.
    if (state.modal && state.modal.type === 'medwithdraw' && state.draft.patientId && q !== state.draft.patientName) { state.draft.patientId = ''; state.draft.patientName = ''; state.draft.phone = ''; }
    if (!q) { state.draft._patientSuggest = []; render(); return; }
    if (state.suggestCache.patients) {
      state.draft._patientSuggest = state.suggestCache.patients.filter(function (p) { return patientMatches(p, q); }).slice(0, 6);
      render();
      return;
    }
    // Cache not ready yet (e.g. very first moments after login) — fall back to a server search.
    call('searchPatients', session.token, q, 6, gsOpts({ quiet: true })).then(function (res) {
      state.draft._patientSuggest = res.data || []; render();
    });
  }, 150);
  function pickPatientSuggest(id) {
    var p = state.draft._patientSuggest.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var prevPatientId = state.draft.patientId;
    state.draft.patientId = p.id; state.draft.patientName = p.firstName + ' ' + p.lastName; state.draft.phone = p.phone;
    state.draft.patientNickname = p.nickname || '';
    state.draft._patientQuery = state.draft.patientName; state.draft._patientSuggest = [];
    // ยาฝาก belong to one patient — choices made for another patient no longer apply.
    // (Only the treatment-record form has ยาฝาก; เบิกยาคลีนิค shares this picker.)
    if (state.modal && state.modal.type === 'record') {
      if (state.draft.patientId !== state.draft._origPatientId) state.draft.depositUseItems = state.draft.useDepositUse ? [NEW_LINE.depositUseItems()] : [];
      // จัดยา-เบิกยา lines belong to one patient too.
      if (p.id !== prevPatientId) state.draft.withdrawItems = [];
      loadDraftDeposits();
      loadDraftPendingWithdrawals(!state.draft.id && p.id !== prevPatientId);
    }
    render();
  }

  /* Round 13 repeatable line-item groups (รายการโปร/ยา/รายการอื่นๆ) — push/
   * splice/render() shape. Round 14 item 1.6: checking on usePromo/
   * useMedicine/useOther now auto-adds the first row itself (see the global
   * `input` listener's checkbox branch), so these add* functions stay the
   * manual "+เพิ่มรายการ" path for every row after the first. */
  /** A new หัตถการ/โปร line starts with the doctor of the last line that has one. */
  function defaultLineDoctor(d) {
    var lines = (d.procedureItems || []).concat(d.promoItems || []).filter(function (l) { return l.doctorId; });
    return lines.length ? lines[lines.length - 1].doctorId : (d.visitDoctorId || '');
  }
  function newProcedureLine(d) { return { procId: '', name: '', price: 0, amount: 0, doctorId: defaultLineDoctor(d) }; }
  function newPromoLine(d) { return { promoId: '', name: '', price: 0, doctorSharePct: 0, amount: 0, doctorId: defaultLineDoctor(d) }; }
  function addProcedureRow() { state.draft.procedureItems.push(newProcedureLine(state.draft)); render(); }
  function removeProcedureRow(idx) { state.draft.procedureItems.splice(idx, 1); render(); updateRecordPreview(); }
  function addPromoRow() { state.draft.promoItems.push(newPromoLine(state.draft)); render(); }
  function removePromoRow(idx) { state.draft.promoItems.splice(idx, 1); render(); }
  function addSupplyRow() { state.draft.supplies.push({ itemId: '', name: '', qty: 1, unit: '' }); render(); }
  function removeSupplyRow(idx) { state.draft.supplies.splice(idx, 1); render(); }
  function addMedicineRow() { state.draft.medicineItems.push(newDispenseLine()); render(); }
  function removeMedicineRow(idx) { state.draft.medicineItems.splice(idx, 1); render(); updateRecordPreview(); }
  function addChargedMedRow() { state.draft.chargedMedItems.push(newDispenseLine()); render(); }
  function removeChargedMedRow(idx) { state.draft.chargedMedItems.splice(idx, 1); render(); updateRecordPreview(); }
  function addOralRow() { state.draft.oralMedItems.push(newOralLine()); render(); }
  function removeOralRow(idx) { state.draft.oralMedItems.splice(idx, 1); render(); updateRecordPreview(); }
  function addCanulaRow() { state.draft.canulaItems.push({ name: '', qty: 1, amount: 0 }); render(); }
  function removeCanulaRow(idx) { state.draft.canulaItems.splice(idx, 1); render(); updateRecordPreview(); }
  /** ถือยาเข้า / ใช้ยาฝาก / Messenger rows: add takes the group name, remove takes "group:index". */
  function addLineRow(group) { state.draft[group].push(NEW_LINE[group]()); render(); }
  function removeLineRow(arg) { var p = String(arg).split(':'); state.draft[p[0]].splice(Number(p[1]), 1); render(); }
  function addOtherRow() { state.draft.otherItems.push({ label: '', amount: 0 }); render(); }
  function removeOtherRow(idx) { state.draft.otherItems.splice(idx, 1); render(); }

  /* Round 14 item 1.7 — resumable-chunk OPD photo upload for a treatment
   * record, same driver (chunkedUpload) as the patient/login-image/logo

    // server can name the file / pick its daily Drive folder off that date
    // (not today's date) — see startResumableUpload's 'opd-photo' branch.

  }

    state.records.opdPhotoUrl = null;

  }
  /** Patient search suggestions with an avatar-initial circle + name/phone (record modal patient picker). */

  /**
   * Client-side preview only — shows staff roughly how the customer amount
   * will split once saved. The server (computeRecordShares_ +
   * recomputeDoctorDayShares_) is always the authoritative calculation,
   * since the daily-minimum doctor top-up depends on every OTHER record
   * for that doctor+date and can't be known client-side.
   */
  /**
   * Client-side preview only — mirrors computeRecordShares_ (round 13
   * formulas) so staff see roughly where the money will land once saved.
   * The server is always authoritative (daily-minimum top-up + the
   * server-trusted Promotions snapshot can't be known/verified client-side).
   */
  /** จำนวนเงินหัตถการ = the รายการหัตถการ lines' total (mirrors saveRecord). */
  function procedureTotal(d) {
    return Math.round((d.useProcedure ? (d.procedureItems || []) : []).reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0) * 100) / 100;
  }
  /** Canula (เข็มทู่) total: the lines' amounts (a draft without lines falls back to the plain canulaAmount). */
  function canulaTotal(d) {
    var items = d.canulaItems || [];
    return Math.round((items.length ? items.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0) : (Number(d.canulaAmount) || 0)) * 100) / 100;
  }
  /** รายการซื้อยาเพิ่มหน้าคลีนิค (คิดค่ายา) total — charged in the ยอดรับชำระ. */
  function chargedMedTotal(d) {
    return d.useChargedMed ? Math.round((d.chargedMedItems || []).reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0) * 100) / 100 : 0;
  }
  /** รายการจ่ายยาทาน total (qty × ราคา/หน่วย per line) — charged in the ยอดรับชำระ. */
  function oralMedTotal(d) {
    return d.useOralMed ? Math.round((d.oralMedItems || []).reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0) * 100) / 100 : 0;
  }
  function newOralLine() { return { itemId: '', name: '', qty: 1, unitPrice: '', amount: 0 }; }
  function recalcOralLine(line) { line.amount = Math.round((Number(line.qty) || 0) * (Number(line.unitPrice) || 0) * 100) / 100; }
  function oralStockItem(itemId) { return stockItemsOfType('oral').filter(function (x) { return x.id === itemId; })[0]; }
  /** Fills an รายการจ่ายยาทาน line's ราคา/หน่วย from the item's ราคาขาย until the user types their own price. */
  function applyAutoOralPrice(line, i) {
    if (!line.itemId || (Number(line.unitPrice) && !line._autoPrice)) return;
    var item = oralStockItem(line.itemId), p = item && (item.prices || [])[0];
    if (p == null || p === '') return;
    line.unitPrice = Number(p); line._autoPrice = true;
    var el = document.querySelector('[data-bind="oralMedItems.' + i + '.unitPrice"]');
    if (el) el.value = line.unitPrice;
  }
  /** The computed bits of one รายการจ่ายยาทาน row (caption under the name, จำนวนเงิน) — patched in place while typing. */
  function patchOralRow(i) {
    var line = state.draft.oralMedItems[i], item = line.itemId ? oralStockItem(line.itemId) : null;
    var cap = document.getElementById('oralCap' + i), tot = document.getElementById('oralTotal' + i);
    if (cap) cap.innerHTML = oralCaptionHtml(line, item);
    if (tot) tot.textContent = money(line.amount || 0);
  }
  function oralCaptionHtml(line, item) {
    if (line.itemId && item) return esc((item.unit ? 'หน่วย ' + item.unit + ' · ' : '') + 'คงเหลือ ' + (Number(item.qty) || 0));
    return String(line.name || '').trim() ? '<span style="color:var(--red-dark)">เลือกยาจากรายการยาทาน</span>' : 'พิมพ์เพื่อค้นหายาทาน';
  }
  function previewShares(d) {
    var amount = procedureTotal(d);
    var canula = d.useCanula ? canulaTotal(d) : 0;
    var sales = d.salesId ? (state.master.sales || []).filter(function (x) { return x.id === d.salesId; })[0] : null;
    var salesPct = sales ? (Number(sales.commissionRate) || 0) : 0;
    // An edited record keeps the % it was saved with unless the sales person changed (mirrors saveRecord).
    if (sales && d.id && d.salesId === d._origSalesId && d.salesCommissionPct != null) salesPct = Number(d.salesCommissionPct) || 0;
    // ส่วนแบ่งแพทย์ per doctor (mirrors buildDoctorShares_): each หัตถการ line
    // at its doctor's own %, each โปร line at the promo's %.
    var byDoctor = {}, order = [];
    var addShare = function (doctorId, v) {
      if (!doctorId) return;
      if (!byDoctor[doctorId]) { byDoctor[doctorId] = { doctor: (state.master.doctors || []).filter(function (x) { return x.id === doctorId; })[0], raw: 0 }; order.push(doctorId); }
      byDoctor[doctorId].raw += v;
    };
    (d.useProcedure ? (d.procedureItems || []) : []).forEach(function (l) {
      var doc = (state.master.doctors || []).filter(function (x) { return x.id === l.doctorId; })[0];
      addShare(l.doctorId, (Number(l.amount) || 0) * (doc ? Number(doc.commissionPct) || 0 : 0) / 100);
    });
    var promoAmount = 0;
    (d.usePromo ? (d.promoItems || []) : []).forEach(function (l) {
      var amt = Number(l.amount) || 0;
      promoAmount += amt;
      addShare(l.doctorId, amt * (Number(l.doctorSharePct) || 0) / 100);
    });
    var r2 = function (n) { return Math.round(n * 100) / 100; };
    var doctors = order.map(function (id) { return { id: id, doctor: byDoctor[id].doctor, raw: r2(byDoctor[id].raw) }; });
    var doctorShareRaw = r2(doctors.reduce(function (s, x) { return s + x.raw; }, 0));
    var otherAmount = (d.useOther ? (d.otherItems || []) : []).reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    var salesShare = r2(amount * salesPct / 100);
    var totalNet = r2(amount + promoAmount + canula + chargedMedTotal(d) + oralMedTotal(d) + otherAmount); // ซื้อยาเพิ่ม (ไม่คิดค่ายา) is not charged
    return { salesShare: salesShare, doctors: doctors, doctorShareRaw: doctorShareRaw, totalNet: totalNet, clinicShare: r2(totalNet - salesShare - doctorShareRaw) };
  }
  /**
   * "รายละเอียดยอดรับชำระ" under the ยอดรับชำระ headline: ส่วนแบ่งแพทย์ (one row
   * per doctor) and ส่วนแบ่งเซลล์ — rows that come to 0 are left out — then
   * ยอดส่วนแบ่งคลีนิค, which is everything else (รายการอื่นๆ included; ยาเบิกเพิ่ม
   * is not charged and there is no supplier share any more).
   */
  function sharePreviewInnerHtml(d) {
    var pv = previewShares(d);
    var short = pv.doctors.filter(function (x) { return x.doctor && Number(x.doctor.minAmount) > x.raw; });
    var minNote = short.length
      ? '<div style="font-size:11px;color:var(--amber-dark);margin-top:6px"><span class="ms" style="font-size:13px;vertical-align:middle">info</span> อาจปรับเพิ่มให้ครบยอดขั้นต่ำต่อวันของ ' +
        esc(short.map(function (x) { return x.doctor.name + ' (' + num(x.doctor.minAmount) + ' บาท)'; }).join(', ')) + ' — คำนวณจริงตอนบันทึก</div>' : '';
    var subRow = function (label, val) {
      return !val ? '' : '<div style="display:flex;justify-content:space-between;padding-left:10px"><span style="color:var(--muted)">' + esc(label) + '</span><span style="font-weight:600">' + money(val) + '</span></div>';
    };

      if (complete && res.data && state.notify.known) state.notify.known[res.data.id] = true; // our own move to รอชำระเงิน is not news to us

      state.board.data = res.data; state.board.updatedAt = new Date(); state.board.loading = false;

  /* Notification: whenever the screen changes (and at login) ask who is รอชำระเงิน; anyone new since the last look lights the
   * ระหว่างดำเนินการ menu (a number) and a toast — opening the board clears it. The first look after login is only a baseline.
   * There is no timer: the only screen that refreshes by itself is ระหว่างดำเนินการ. */
  function pollQueueAlerts() {
    if (!session.token || document.hidden) return;
    call('getQueueAlerts', session.token, gsOpts({ quiet: true })).then(function (res) {
      var list = (res.data && res.data.waitingPayment) || [], N = state.notify;
      var ids = {}; list.forEach(function (x) { ids[x.id] = true; });
      if (N.known) {
        var fresh = list.filter(function (x) { return !N.known[x.id]; });
        if (fresh.length && state.screen !== 'board') {
          N.unseen += fresh.length;
          toast('success', 'รอชำระเงิน: ' + fresh.map(function (x) { return (x.queue ? 'คิว ' + x.queue + ' ' : '') + x.patientName; }).join(', '));
          render();
        }

      N.known = ids;
    }, function () { /* try again at the next tick */ });
  }
  function clearQueueAlerts() { if (state.notify.unseen) { state.notify.unseen = 0; render(); } }
  // The board stays current on its own while it is on screen (several people work from it): every 10 minutes, plus the รีเฟรช button.

  function boardCard(c, st) {

    // treatment record, and saving it (บันทึกการรักษา → รอชำระเงิน) moves the customer on to รอชำระเงิน.

  /** A column's cards; พบแพทย์ is split by the doctor each customer is seeing. */

        '<button class="btn" style="margin-left:auto" data-action="stock-csv-template" title="ดาวน์โหลดไฟล์ตัวอย่าง CSV"><span class="ms">download</span> Template CSV</button>' +

  /* ---- อัปโหลด CSV ---- */
  // Header text -> field. The ราคาขาย tier columns are matched by their "N ชิ้น" number.
  var STOCK_CSV_COLUMNS = [
    { re: /^ชื่อ/, key: 'name' }, { re: /หมวด/, key: 'category' }, { re: /หน่วย/, key: 'unit' },
    { re: /ขั้นต่ำ/, key: 'minQty' }, { re: /คงเหลือ/, key: 'qty' }, { re: /ทุน/, key: 'costPrice' },
    { re: /^ราคาขาย/, key: 'price1' } // รายการยาทาน has one ราคาขาย (the tier columns of ยา are matched by their "N ชิ้น" first)
  ];
  function stockCsvHeaders(type) {
    var h = [type === 'medicine' || type === 'oral' ? 'ชื่อยา' : 'ชื่อเวชภัณฑ์', 'หมวดหมู่', 'หน่วย', 'จำนวนสต๊อกขั้นต่ำ', 'จำนวนคงเหลือ'];
    if (type === 'oral') return h.concat(['ราคาขาย']);
    return type === 'medicine' ? h.concat(['ราคาทุน'], STOCK_PRICE_TIERS.map(function (t) { return 'ราคาขาย จำนวน ' + t + ' ชิ้น'; })) : h;
  }
  function downloadStockCsvTemplate() {
    var csv = '﻿' + stockCsvHeaders(state.stock.type).join(',') + '\r\n';
    var a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'stock-' + state.stock.type + '-template.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
  /** Minimal RFC-4180 CSV parser (quoted fields, "" escapes, CRLF/LF). */
  function parseCsv(text) {
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (q) {
        if (c === '"') { if (text.charAt(i + 1) === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text.charAt(i + 1) === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  /** CSV text -> {rows, columns} in importStockCsv's shape, or {error}. The header row is the first row with a "ชื่อ..." cell, so a merged "ราคาขาย" row above it is skipped. */
  function stockRowsFromCsv(text) {
    var grid = parseCsv(text.replace(/^﻿/, ''));
    var hi = -1;
    for (var r = 0; r < grid.length && hi < 0; r++) {
      if (grid[r].some(function (c) { return /^ชื่อ/.test(String(c).trim()); })) hi = r;
    }
    if (hi < 0) return { error: 'ไม่พบหัวตาราง (ต้องมีคอลัมน์ที่ขึ้นต้นด้วย "ชื่อ" เช่น ชื่อยา)' };
    var colMap = {}, found = [];
    grid[hi].forEach(function (raw, ci) {
      var h = String(raw).trim();
      if (!h) return;
      var tier = h.match(/(\d+)\s*ชิ้น/);
      if (tier && STOCK_PRICE_TIERS.indexOf(Number(tier[1])) > -1) { colMap[ci] = 'price' + tier[1]; found.push(h); return; }
      for (var k = 0; k < STOCK_CSV_COLUMNS.length; k++) {
        if (STOCK_CSV_COLUMNS[k].re.test(h) && Object.keys(colMap).map(function (x) { return colMap[x]; }).indexOf(STOCK_CSV_COLUMNS[k].key) === -1) {
          colMap[ci] = STOCK_CSV_COLUMNS[k].key; found.push(h); return;
        }
      }
    });
    var num = function (v) { v = String(v == null ? '' : v).replace(/[,\s฿]/g, ''); return v === '' ? '' : v; };
    var rows = grid.slice(hi + 1).filter(function (cells) { return cells.some(function (c) { return String(c).trim(); }); }).map(function (cells) {
      var o = { prices: STOCK_PRICE_TIERS.map(function () { return ''; }) };
      Object.keys(colMap).forEach(function (ci) {
        var key = colMap[ci], v = cells[ci] == null ? '' : String(cells[ci]).trim();
        if (key.indexOf('price') === 0) o.prices[STOCK_PRICE_TIERS.indexOf(Number(key.slice(5)))] = num(v);
        else o[key] = (key === 'name' || key === 'category' || key === 'unit') ? v : num(v);
      });
      return o;
    });
    if (!rows.length) return { error: 'ไม่พบรายการใต้หัวตาราง' };
    return { rows: rows, columns: found };
  }
  function pickStockCsv() {
    var input = document.getElementById('stockCsvInput');
    input.onchange = function () {
      var file = input.files && input.files[0];
      input.value = '';
      if (file) readStockCsv(file);
    };
    input.click();
  }
  function readStockCsv(file) {
    var read = function (encoding, done) {
      var fr = new FileReader();
      fr.onload = function () { done(String(fr.result || '')); };
      fr.readAsText(file, encoding);
    };
    // Excel's plain "CSV" save on Thai Windows is windows-874, not UTF-8 — retry if UTF-8 decoding produced replacement chars.
    read('UTF-8', function (text) {
      if (text.indexOf('�') > -1) read('windows-874', importStockCsvText);
      else importStockCsvText(text);
    });
  }
  function importStockCsvText(text) {
    var parsed = stockRowsFromCsv(text);
    if (parsed.error) { toast('error', parsed.error); return; }
    var type = state.stock.type, typeLabel = stockTypeLabel(type);
    var costNote = (!isAdmin() && parsed.columns.some(function (c) { return /ทุน/.test(c); })) ? '<div style="margin-top:6px;color:var(--amber-dark)">คอลัมน์ราคาทุนจะไม่ถูกนำเข้า (ต้องใช้สิทธิ์ผู้ดูแลระบบ)</div>' : '';
    Swal.fire({
      icon: 'question', title: 'นำเข้า ' + parsed.rows.length + ' รายการ เข้าสต๊อก' + typeLabel + '?',
      html: '<div style="font-size:13px;text-align:left">คอลัมน์ที่พบ: ' + esc(parsed.columns.join(', ')) +
        '<div style="margin-top:6px">ชื่อที่มีอยู่แล้วในสต๊อก' + typeLabel + 'จะถูกอัพเดต ชื่อใหม่จะถูกเพิ่ม ช่องว่างจะไม่เปลี่ยนค่าเดิม และจำนวนคงเหลือที่เปลี่ยนจะบันทึกลงประวัติ</div>' + costNote + '</div>',
      showCancelButton: true, confirmButtonText: 'นำเข้า', cancelButtonText: 'ยกเลิก'
    }).then(function (r) {
      if (!r.isConfirmed) return;
      call('importStockCsv', session.token, { type: type, rows: parsed.rows }).then(function (res) {
        var d = res.data;
        toast('success', 'นำเข้าแล้ว: เพิ่ม ' + d.created + ' · อัพเดต ' + d.updated + ' รายการ');
        if (d.newCategories && d.newCategories.length) refreshMaster();
        afterStockLogWrite(); refreshStockSuggestCache();
      });
    });
  }

  /** Scales the page down to the available width (never up). */
  function fitPdfPreview() {
    var p = state.report.preview;
    var scroll = document.getElementById('pdfPreviewScroll'), frame = document.getElementById('pdfPreviewFrame'), page = document.getElementById('pdfPreviewPage');
    if (!p || !scroll || !page) return;
    if (scroll.clientWidth <= 32) { setTimeout(fitPdfPreview, 100); return; } // not laid out yet — try again shortly
    var w = reportPdfWidth(p.kind);
    var scale = Math.min(1, (scroll.clientWidth - 32) / w);
    page.style.transform = 'scale(' + scale + ')';
    frame.style.width = Math.round(w * scale) + 'px';
    frame.style.height = Math.round(page.firstChild.offsetHeight * scale) + 'px';
  }

  function downloadReportPdf() {
    var p = state.report.preview;
    if (!p || isBusy('report-pdf-download|')) return;
    busyStart('report-pdf-download|');
    var finish = function () { busyEnd('report-pdf-download|'); };
    setLoading(true);
    Promise.all([loadHtml2Pdf(), ensureClinicLogo()]).then(function () {
      // Off-screen but laid out (html2canvas can't capture display:none).
      var holder = document.createElement('div');
      holder.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1';
      holder.innerHTML = reportPdfHtml(p.kind, p.data, p.scope);
      document.body.appendChild(holder);
      var done = function () { holder.remove(); setLoading(false); finish(); closePdfPreview(); };
      return window.html2pdf().set({
        // A4 in mm; the page is scaled to the paper width.
        margin: [0, 0, 8, 0], filename: p.filename,
        image: { type: 'jpeg', quality: 0.96 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        // Table rows are never split across pages.
        pagebreak: { mode: ['css', 'legacy'], avoid: ['tr'] }
      }).from(holder.firstChild).save().then(done, function (e) { holder.remove(); setLoading(false); throw e; });
    }).catch(function (e) { setLoading(false); finish(); toast('error', (e && e.message) || 'สร้าง PDF ไม่สำเร็จ'); });

  document.addEventListener('click', function (ev) {
    // Portal option pick
    var portalOpt = ev.target.closest('[data-portal-pick]');
    if (portalOpt) {
      var val = portalOpt.getAttribute('data-portal-pick');
      var p = state.portal;
      closePortal();
      if (p && p.onPick) {
        var pickKey = 'id:' + p.triggerId; // a write from a dropdown menu shows on (and blocks) its trigger button
        if (isBusy(pickKey)) return;
        armedKey = null; clickKey = pickKey;
        p.onPick(val);
        endClick(pickKey);
      }
      return;
    }
    // Clicking a stock-name input (re)opens its picker; the portal-closing rule below must not eat that click.
    var medInput = ev.target.closest('[data-med-pick]');
    if (medInput) {
      if (!state.portal || state.portal.triggerId !== medInput.id) openMedPicker(medInput);
      return;
    }
    if (ev.target === portalEl || (state.portal && !ev.target.closest('.portal-dd') && !ev.target.closest('[data-action^="dd-"]'))) {
      if (state.portal) closePortal();
    }

    // Round 15 item 4: clicking anywhere outside a search box's own
    // input+dropdown wrapper closes any open suggestion dropdown.
    if (!ev.target.closest('[data-search-scope]')) {
      Object.keys(SEARCH_SCOPES).forEach(closeSearchSuggest);
    }

    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var arg = el.getAttribute('data-arg');
    var idx = el.getAttribute('data-idx');

    // Still saving / deleting from this button: ignore the click (see busyKeys).
    var clickBusyKey = action + '|' + (arg || '');
    if (isBusy(clickBusyKey) || (el.id && isBusy('id:' + el.id))) { ev.preventDefault(); return; }
    armedKey = null; clickKey = clickBusyKey;
    endClick(clickBusyKey);

    switch (action) {
      case 'nav': goNav(arg); break;
      case 'toggle-login-password': {
        var pwInput = document.getElementById('loginPassword');
        if (pwInput) {
          var showing = pwInput.type === 'text';
          pwInput.type = showing ? 'password' : 'text';
          el.textContent = showing ? 'visibility_off' : 'visibility';
        }
        break;
      }
      case 'logout': doLogout(); break;
      case 'user-menu':
        openPortal('userMenuTrigger', [
          { value: 'change-password', label: 'เปลี่ยนรหัสผ่าน' },
          { value: 'logout', label: 'ออกจากระบบ' }
        ], function (v) {
          if (v === 'change-password') openModal('change-password', { current: '', next: '', confirm: '' });
          else if (v === 'logout') doLogout();
        });
        break;
      case 'close-modal': case 'close-modal-bg': if (ev.target === el || action === 'close-modal') closeModal(); break;
      case 'save-modal': saveModal(); break;
      case 'save-record-pay': saveRecordModal(true, true); break;
      case 'save-record-complete': saveRecordModal(false, true); break;
      case 'remove-withdraw-item': state.draft.withdrawItems.splice(Number(arg), 1); render(); break;
      case 'pay-record': payRecordAction(arg); break;
      case 'new-patient': newPatientModal(); break;
      case 'edit-patient': editPatientModal(arg); break;
      case 'delete-patient': deletePatientConfirm(arg); break;
      case 'view-patient': togglePatientPanel(arg); break;
      case 'close-patient-panel': case 'close-patient-panel-bg': if (ev.target === el || action === 'close-patient-panel') closePatientPanel(); break;
      case 'patient-panel-add-record': {
        var ptForRecord = state.patients.panel && state.patients.panel.patient;
        if (ptForRecord) { closePatientPanel(); newRecordModalForPatient(ptForRecord); }
        break;
      }
      case 'patient-panel-edit': {
        var pidForEdit = state.patients.panel && state.patients.panel.id;
        if (pidForEdit) { closePatientPanel(); editPatientModal(pidForEdit); }
        break;

        else if (bindPath === 'useMessenger' && !state.draft.messengerItems.length) state.draft.messengerItems.push(NEW_LINE.messengerItems());
        else if (bindPath === 'useOther' && !state.draft.otherItems.length) state.draft.otherItems.push({ label: '', amount: 0 });
      }
      render();
      return;
    }
    if (isLivePreviewBindPath(bindPath)) updateRecordPreview();
  });

  // Round 15 item 2.3: re-format a money field's displayed text to
  // "#,###.##" once the user leaves it — done on blur (via 'focusout',
  // which bubbles, unlike 'blur') rather than on every keystroke, so
  // reformatting never fights the caret position while typing.
  document.addEventListener('focusin', function (ev) {
    if (ev.target.hasAttribute && ev.target.hasAttribute('data-med-pick')) openMedPicker(ev.target);
  });
  // Stock-name pickers: Escape/Tab close the list, Enter takes the first match (like picking it).
  document.addEventListener('keydown', function (ev) {
    var el = ev.target;
    if (!el.hasAttribute || !el.hasAttribute('data-med-pick')) return;
    if (ev.key === 'Escape' || ev.key === 'Tab') { if (state.portal) closePortal(); return; }
    if (ev.key === 'Enter') {
      ev.preventDefault();
      var first = state.portal && state.portal.triggerId === el.id ? state.portal.options[0] : null;
      if (first && state.portal.onPick) { var pick = state.portal.onPick; closePortal(); pick(first.value); }
    }
  });
  document.addEventListener('focusout', function (ev) {
    var el = ev.target;
    var bindPath = el.getAttribute && el.getAttribute('data-bind');
    if (!bindPath || !state.draft || !isMoneyBindPath(bindPath)) return;
    el.value = formatMoneyValue(getPath(state.draft, bindPath));
  });

  // Round 15 item 4: pressing Enter in a suggest-then-commit search box
  // commits the typed text as-is (no exact suggestion match required) —
  // an escape hatch for when the wanted result isn't in the small
  // suggestion list, without reintroducing a load on every keystroke.
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var wrap = ev.target.closest && ev.target.closest('[data-search-scope]');
    if (!wrap) return;
    var sc = SEARCH_SCOPES[wrap.getAttribute('data-search-scope')];
    if (!sc) return;
    ev.preventDefault();
    setPath(state, sc.qPath, ev.target.value);
    setPath(state, sc.suggestPath, []);
    render();
    sc.commit();
  });

  /* Expose the handful of functions used by inline oninput= attributes (search boxes need live typing without full re-render churn on every keystroke going through data-action). */
  window.__valin = {
    onListSearchInput: onListSearchInput,
    onPatientSuggestSearch: onPatientSuggestSearch, onPromotionSearch: onPromotionSearch, onWithdrawSearch: onWithdrawSearch,
    onProcedureSearch: onProcedureSearch, onDepositSearch: onDepositSearch, onBoardSearch: onBoardSearch
  };

  /* ---------------------------------------------------------------- */
  /* Bootstrap                                                           */
  /* ---------------------------------------------------------------- */
  function init() {
    if (session.token) {
      call('getCurrentUser', session.token, gsOpts({ quiet: true })).then(function (res) {
        if (res.ok) { session.user = res.user; afterLogin(); }
        else { resetToLogin(); }
      }, resetToLogin);
    } else {
      render();
    }
  }
  init();
})();
</script></body></html>
