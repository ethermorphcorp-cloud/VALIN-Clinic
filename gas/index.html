    return '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">' +
      (d.id ? '<button class="btn" data-action="issue-receipt" data-arg="' + esc(d.id) + '"><span class="ms">print</span> พิมพ์ใบเสร็จ</button>' : '<span></span>') +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn" data-action="close-modal">ยกเลิก</button>' +
        '<button class="btn btn-primary" data-action="save-modal">บันทึก</button>' +
      '</div>' +
    '</div>';
  }

  function saveRecordModal() {
    if (!state.draft.patientId) { toast('error', 'กรุณาเลือกคนไข้'); return; }
    var payload = Object.assign({}, state.draft);
    Object.keys(payload).forEach(function (k) { if (k.charAt(0) === '_') delete payload[k]; }); // client-only (_patientQuery, _deposits, ...)
    call('saveRecord', session.token, payload).then(function () {
      toast('success', 'บันทึกข้อมูลการรักษาแล้ว'); closeModal();
      // Round 12 item 1.3: refresh whichever Records view is on screen — the
      // table load above alone left a stale calendar (state.records.calData)
      // when the modal was opened from calendar view, since loadRecords()
      // only refetches the table's listRecords data.
      loadRecords();
      if (state.records.calData) loadCalendar();
      if (state.stock.list) loadStock();
    });
  }

  /* ================================================================== */
  /* STOCK — จัดการสต๊อก (tabs: รายการเวชภัณฑ์ / รายการยา)                  */
  /* ================================================================== */
  function loadStock() {
    var type = state.stock.type;
    call('listStock', session.token, { page: state.stock.page, filters: { q: state.stock.q, category: state.stock.category, type: type } }).then(function (res) {
      if (type !== state.stock.type) return; // tab switched while loading
      state.stock.list = res.data; state.stock.reloading = false; render();
    });
  }
  var STOCK_TABS = [{ id: 'supply', label: 'รายการเวชภัณฑ์' }, { id: 'medicine', label: 'รายการยา' }];
  // Must match STOCK_PRICE_TIERS in Code.gs — item.prices[i] is the ราคาขาย for STOCK_PRICE_TIERS[i] ชิ้น.
  var STOCK_PRICE_TIERS = [1, 3, 5, 10, 20, 50];
  var STOCK_LOG_KIND_LABELS = { update: 'อัพเดตสต๊อก', in: 'รับเข้า', out: 'เบิกออก', set: 'ปรับยอดคงเหลือ', import: 'นำเข้า CSV', opening: 'ยอดยกมา', record: 'บันทึกการรักษา', withdraw: 'เบิกยาคลีนิค', purchase: 'จัดซื้อ' };
  function stockTypeLabel(type) { return type === 'medicine' ? 'ยา' : 'เวชภัณฑ์'; }
  function stockTab(type) {
    if (type === state.stock.type) return;
    state.stock.type = type;
    state.stock.list = null; state.stock.page = 1; state.stock.q = ''; state.stock.category = ''; state.stock.searchSuggest = [];
    render(); loadStock();
  }
  function stockNumCell(v) { return v == null ? '<span style="color:var(--muted)">-</span>' : esc(Number(v).toLocaleString('en-US')); }
  function stockMoneyCell(v) { return v == null ? '<span style="color:var(--muted)">-</span>' : esc(money(v)); }

  /**
   * Flat table, one row per item. รายการยา shows the full price sheet
   * (ราคาทุน for admins only — the server never sends it to staff — and the
   * six ราคาขาย tiers under one grouped header), so it scrolls sideways on
   * narrow screens. Movement history moved from an expandable row into the
   * per-row "ประวัติ" side panel (see stockPanelTemplate).
   */
  function stockTemplate() {
    var catOpts = [{ value: '', label: 'หมวดหมู่ทั้งหมด' }].concat((state.master.stockCategories || []).map(function (c) { return { value: c.name, label: c.name }; }));
    var L = state.stock.list;
    var type = state.stock.type, typeLabel = stockTypeLabel(type);
    var isMed = type === 'medicine', showCost = isMed && isAdmin();
    var colCount = isMed ? (showCost ? 13 : 12) : 5;
    var rows = !L ? '<tr><td colspan="' + colCount + '" class="empty-state"><span class="spin"></span> กำลังโหลด...</td></tr>' :
      (!L.items.length ? '<tr><td colspan="' + colCount + '" class="empty-state">ไม่พบรายการ' + typeLabel + '</td></tr>' :
      L.items.map(function (s) { return stockItemRowHtml(s, isMed, showCost); }).join(''));
    var th = 'padding:10px 12px;white-space:nowrap';
    var head = isMed
      ? '<tr style="text-align:left;font-size:12px;color:var(--muted);background:var(--hover-bg)">' +
          '<th rowspan="2" style="' + th + '">ชื่อยา</th><th rowspan="2" style="' + th + '">หมวดหมู่</th><th rowspan="2" style="' + th + '">จำนวนสต๊อกขั้นต่ำ</th>' +
          // จำนวนคงเหลือ split: ยาฝาก held for patients vs. stock that can still be dispensed.
          '<th rowspan="2" style="' + th + '">จำนวนฝาก</th><th rowspan="2" style="' + th + '">จำนวนพร้อมใช้</th>' +
          (showCost ? '<th rowspan="2" style="' + th + '">ราคาทุน</th>' : '') +
          '<th colspan="6" style="' + th + ';text-align:center;border-bottom:1px solid var(--border)">ราคาขาย</th><th rowspan="2"></th></tr>' +
        '<tr style="text-align:left;font-size:12px;color:var(--muted);background:var(--hover-bg)">' +
          STOCK_PRICE_TIERS.map(function (t) { return '<th style="' + th + '">จำนวน ' + t + ' ชิ้น</th>'; }).join('') + '</tr>'
      : '<tr style="text-align:left;font-size:12px;color:var(--muted);background:var(--hover-bg)">' +
          '<th style="' + th + '">ชื่อเวชภัณฑ์</th><th style="' + th + '">หมวดหมู่</th><th style="' + th + '">จำนวนสต๊อกขั้นต่ำ</th><th style="' + th + '">จำนวนคงเหลือ</th><th></th></tr>';
    var sum = (L && L.summary) || null;
    var countText = function (n) { return sum ? esc(n) + ' <span style="font-size:15px;font-weight:500;color:var(--muted)">รายการ</span>' : '<span class="spin"></span>'; };
    return '' +
      tabBar(STOCK_TABS, type, 'stock-tab') +
      '<div class="grid-fit" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">' +
        statCard('inventory_2', 'จำนวนรายการ' + typeLabel, countText(sum && sum.total)) +
        statCard('warning', 'ใกล้หมด', countText(sum && sum.low)) +
        statCard('block', 'หมดแล้ว', countText(sum && sum.out)) +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
        searchScopeBoxHtml('stock', '240px') +
        '<button id="ddStockCat" class="btn" data-action="dd-stockcat">' + esc((catOpts.filter(function (o) { return o.value === state.stock.category; })[0] || {}).label || 'หมวดหมู่ทั้งหมด') + ' <span class="ms">expand_more</span></button>' +
        '<button class="btn" style="margin-left:auto" data-action="stock-csv-template" title="ดาวน์โหลดไฟล์ตัวอย่าง CSV"><span class="ms">download</span> Template CSV</button>' +
        '<button class="btn" data-action="stock-csv-upload"><span class="ms">upload_file</span> อัปโหลด CSV</button>' +
        '<input type="file" id="stockCsvInput" accept=".csv,text/csv" style="display:none">' +
        '<button class="btn" data-action="new-stock"><span class="ms">add</span> เพิ่ม' + typeLabel + '</button>' +
        '<button class="btn btn-primary" data-action="new-stock-update"><span class="ms">inventory</span> อัพเดตสต๊อก' + typeLabel + '</button>' +
      '</div>' +
      listCardWrap(
        '<div style="overflow-x:auto"><table class="table stock-table" style="width:100%;border-collapse:collapse">' +
          '<thead>' + head + '</thead>' +
          '<tbody>' + rows + '</tbody></table></div>', state.stock.reloading) + pagerHtml(L, 'stock-page');
  }
  function stockItemRowHtml(s, isMed, showCost) {
    var qty = s.latestQtyRemaining != null ? s.latestQtyRemaining : s.qty;
    // ใกล้หมด uses the item's own จำนวนสต๊อกขั้นต่ำ when set, else the old fixed threshold of 10.
    var low = s.minQty != null ? qty <= s.minQty : qty <= 10;
    var qtyBadge = qty < 0 ? ' <span class="tag-badge" style="background:var(--red-soft);color:var(--red-dark)">ติดลบ</span>' : qty === 0 ? ' <span class="tag-badge" style="background:var(--red-soft);color:var(--red-dark)">หมด</span>' : (low ? ' <span class="tag-badge" style="background:var(--amber-soft);color:var(--amber-dark)">ใกล้หมด</span>' : '');
    var dateNote = s.latestDate ? '<div style="font-size:11px;color:var(--muted)">อัพเดตล่าสุด ' + esc(s.latestDate) + '</div>' : '<div style="font-size:11px;color:var(--muted)">ยังไม่มีประวัติ</div>';
    // One "จัดการ" button per row opening the shared portal dropdown (see openStockActions).
    var actions = '<td style="text-align:right;white-space:nowrap">' +
      '<button class="btn" id="stockAct_' + esc(s.id) + '" data-action="dd-stock-actions" data-arg="' + esc(s.id) + '">จัดการ <span class="ms">expand_more</span></button>' +
    '</td>';
    return '<tr>' +
      '<td style="padding:10px 12px">' + esc(s.name) + '</td>' +
      '<td>' + esc(s.category) + '</td>' +
      '<td>' + stockNumCell(s.minQty) + '</td>' +
      (isMed ? '<td style="white-space:nowrap">' + (s.depositQty
        ? '<span class="tag-badge" style="background:var(--green-soft);color:var(--green-dark)">' + esc(s.depositQty) + ' ' + esc(s.unit) + '</span>'
        : '<span style="color:var(--muted)">-</span>') + '</td>' : '') +
      '<td style="white-space:nowrap">' + esc(qty) + ' ' + esc(s.unit) + qtyBadge + dateNote + '</td>' +
      (isMed ? (showCost ? '<td>' + stockMoneyCell(s.costPrice) + '</td>' : '') + (s.prices || []).map(function (p) { return '<td>' + stockMoneyCell(p) + '</td>'; }).join('') : '') +
      actions + '</tr>';
  }
  function stockItemById(id) { return ((state.stock.list && state.stock.list.items) || []).filter(function (x) { return x.id === id; })[0]; }
  /** The row's จัดการ menu: ประวัติ / ปรับสต๊อก / แก้ไข, plus ลบ for admins. */
  function openStockActions(id) {
    var triggerId = 'stockAct_' + id;
    if (state.portal && state.portal.triggerId === triggerId) { closePortal(); return; } // second click closes
    var opts = [
      { value: 'history', label: 'ประวัติการเคลื่อนไหว', icon: 'history' },
      { value: 'adjust', label: 'ปรับสต๊อก', icon: 'tune' },
      { value: 'edit', label: 'แก้ไขข้อมูล', icon: 'edit' }
    ];
    if (isAdmin()) opts.push({ value: 'delete', label: 'ลบรายการ', icon: 'delete', danger: true });
    openPortal(triggerId, opts, function (v) {
      if (v === 'history') openStockPanel(id);
      else if (v === 'adjust') newStockAdjustModal(id);
      else if (v === 'edit') editStockModal(id);
      else if (v === 'delete') deleteStockConfirm(id);
    }, null);
  }

  /* ---- ประวัติการเคลื่อนไหว side panel (own root, see renderStockPanel) ---- */
  var stockPanelEl = document.getElementById('stockPanelRoot');
  function renderStockPanel() { stockPanelEl.innerHTML = stockPanelTemplate(); }
  function openStockPanel(id) {
    var item = stockItemById(id);
    if (!item) return;
    state.stock.panel = { item: item, log: null };
    renderStockPanel();
    loadStockLog(id);
  }
  function closeStockPanel() { state.stock.panel = null; renderStockPanel(); }
  function loadStockLog(id) {
    call('getStockLog', session.token, id).then(function (res) {
      var p = state.stock.panel;
      if (!p || p.item.id !== id) return; // panel closed/switched meanwhile
      p.log = res.data;
      var fresh = stockItemById(id);
      if (fresh) p.item = fresh;
      renderStockPanel();
    });
  }
  /** Reloads whatever a StockLog write could have changed: the list, and the open history panel. */
  function afterStockLogWrite() {
    loadStock();

  /* ---- อัปโหลด CSV ---- */
  // Header text -> field. The ราคาขาย tier columns are matched by their "N ชิ้น" number.
  var STOCK_CSV_COLUMNS = [
    { re: /^ชื่อ/, key: 'name' }, { re: /หมวด/, key: 'category' }, { re: /หน่วย/, key: 'unit' },
    { re: /ขั้นต่ำ/, key: 'minQty' }, { re: /คงเหลือ/, key: 'qty' }, { re: /ทุน/, key: 'costPrice' }
  ];
  function stockCsvHeaders(type) {
    var h = [type === 'medicine' ? 'ชื่อยา' : 'ชื่อเวชภัณฑ์', 'หมวดหมู่', 'หน่วย', 'จำนวนสต๊อกขั้นต่ำ', 'จำนวนคงเหลือ'];
    return type === 'medicine' ? h.concat(['ราคาทุน'], STOCK_PRICE_TIERS.map(function (t) { return 'ราคาขาย จำนวน ' + t + ' ชิ้น'; })) : h;
  }
  function downloadStockCsvTemplate() {
    var csv = '﻿' + stockCsvHeaders(state.stock.type).join(',') + '\r\n';
    var a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'stock-' + state.stock.type + '-template.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
  /** Minimal RFC-4180 CSV parser (quoted fields, "" escapes, CRLF/LF). */
  function parseCsv(text) {
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (q) {
        if (c === '"') { if (text.charAt(i + 1) === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text.charAt(i + 1) === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  /** CSV text -> {rows, columns} in importStockCsv's shape, or {error}. The header row is the first row with a "ชื่อ..." cell, so a merged "ราคาขาย" row above it is skipped. */
  function stockRowsFromCsv(text) {
    var grid = parseCsv(text.replace(/^﻿/, ''));
    var hi = -1;
    for (var r = 0; r < grid.length && hi < 0; r++) {
      if (grid[r].some(function (c) { return /^ชื่อ/.test(String(c).trim()); })) hi = r;
    }
    if (hi < 0) return { error: 'ไม่พบหัวตาราง (ต้องมีคอลัมน์ที่ขึ้นต้นด้วย "ชื่อ" เช่น ชื่อยา)' };
    var colMap = {}, found = [];
    grid[hi].forEach(function (raw, ci) {
      var h = String(raw).trim();
      if (!h) return;
      var tier = h.match(/(\d+)\s*ชิ้น/);
      if (tier && STOCK_PRICE_TIERS.indexOf(Number(tier[1])) > -1) { colMap[ci] = 'price' + tier[1]; found.push(h); return; }
      for (var k = 0; k < STOCK_CSV_COLUMNS.length; k++) {
        if (STOCK_CSV_COLUMNS[k].re.test(h) && Object.keys(colMap).map(function (x) { return colMap[x]; }).indexOf(STOCK_CSV_COLUMNS[k].key) === -1) {
          colMap[ci] = STOCK_CSV_COLUMNS[k].key; found.push(h); return;
        }
      }
    });
    var num = function (v) { v = String(v == null ? '' : v).replace(/[,\s฿]/g, ''); return v === '' ? '' : v; };
    var rows = grid.slice(hi + 1).filter(function (cells) { return cells.some(function (c) { return String(c).trim(); }); }).map(function (cells) {
      var o = { prices: STOCK_PRICE_TIERS.map(function () { return ''; }) };
      Object.keys(colMap).forEach(function (ci) {
        var key = colMap[ci], v = cells[ci] == null ? '' : String(cells[ci]).trim();
        if (key.indexOf('price') === 0) o.prices[STOCK_PRICE_TIERS.indexOf(Number(key.slice(5)))] = num(v);
        else o[key] = (key === 'name' || key === 'category' || key === 'unit') ? v : num(v);
      });
      return o;
    });
    if (!rows.length) return { error: 'ไม่พบรายการใต้หัวตาราง' };
    return { rows: rows, columns: found };
  }
  function pickStockCsv() {
    var input = document.getElementById('stockCsvInput');
    input.onchange = function () {
      var file = input.files && input.files[0];
      input.value = '';
      if (file) readStockCsv(file);
    };
    input.click();
  }
  function readStockCsv(file) {
    var read = function (encoding, done) {
      var fr = new FileReader();
      fr.onload = function () { done(String(fr.result || '')); };
      fr.readAsText(file, encoding);
    };
    // Excel's plain "CSV" save on Thai Windows is windows-874, not UTF-8 — retry if UTF-8 decoding produced replacement chars.
    read('UTF-8', function (text) {
      if (text.indexOf('�') > -1) read('windows-874', importStockCsvText);
      else importStockCsvText(text);
    });
  }
  function importStockCsvText(text) {
    var parsed = stockRowsFromCsv(text);
    if (parsed.error) { toast('error', parsed.error); return; }
    var type = state.stock.type, typeLabel = stockTypeLabel(type);
    var costNote = (!isAdmin() && parsed.columns.some(function (c) { return /ทุน/.test(c); })) ? '<div style="margin-top:6px;color:var(--amber-dark)">คอลัมน์ราคาทุนจะไม่ถูกนำเข้า (ต้องใช้สิทธิ์ผู้ดูแลระบบ)</div>' : '';
    Swal.fire({
      icon: 'question', title: 'นำเข้า ' + parsed.rows.length + ' รายการ เข้าสต๊อก' + typeLabel + '?',
      html: '<div style="font-size:13px;text-align:left">คอลัมน์ที่พบ: ' + esc(parsed.columns.join(', ')) +
        '<div style="margin-top:6px">ชื่อที่มีอยู่แล้วในสต๊อก' + typeLabel + 'จะถูกอัพเดต ชื่อใหม่จะถูกเพิ่ม ช่องว่างจะไม่เปลี่ยนค่าเดิม และจำนวนคงเหลือที่เปลี่ยนจะบันทึกลงประวัติ</div>' + costNote + '</div>',
      showCancelButton: true, confirmButtonText: 'นำเข้า', cancelButtonText: 'ยกเลิก'
    }).then(function (r) {
      if (!r.isConfirmed) return;
      call('importStockCsv', session.token, { type: type, rows: parsed.rows }).then(function (res) {
        var d = res.data;
        toast('success', 'นำเข้าแล้ว: เพิ่ม ' + d.created + ' · อัพเดต ' + d.updated + ' รายการ');
        if (d.newCategories && d.newCategories.length) refreshMaster();
        afterStockLogWrite(); refreshStockSuggestCache();
      });
    });
  }

  /** Medicine stock id for an exact name match, or ''. */
  function stockItemIdByName(name) {
    var s = stockItemsOfType('medicine').filter(function (x) { return x.name === String(name || '').trim(); })[0];
    return s ? s.id : '';
  }
  function saveWithdrawModal() {
    var d = state.draft;
    if (!d.patientId) { toast('error', 'กรุณาเลือกคนไข้'); return; }
    if (!d.salesId) { toast('error', 'กรุณาเลือกชื่อเซลล์'); return; }
    var lines = d.lines.filter(function (l) { return String(l.name || '').trim(); });
    if (!lines.length) { toast('error', 'กรุณาเลือกยาอย่างน้อย 1 รายการ'); return; }
    var bad = lines.filter(function (l) { return !stockItemIdByName(l.name); })[0];
    if (bad) { toast('error', 'ไม่พบ "' + bad.name + '" ในสต๊อกยา กรุณาเลือกจากรายการ'); return; }
    call('saveMedWithdrawal', session.token, {
      date: d.date, patientId: d.patientId, salesId: d.salesId, note: d.note,
      lines: lines.map(function (l) { return { itemId: stockItemIdByName(l.name), qty: l.qty }; })
    }).then(function () {
      toast('success', 'บันทึกการเบิกยาแล้ว'); closeModal();
      loadWithdrawals();
      if (state.stock.list) loadStock();
    });
  }

  /* ---- PDF ---- */
  var html2pdfLoading = null;
  function loadHtml2Pdf() {
    if (window.html2pdf) return Promise.resolve();
    if (!html2pdfLoading) {
      html2pdfLoading = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        s.onload = function () { resolve(); };
        s.onerror = function () { html2pdfLoading = null; reject(new Error('โหลดตัวสร้าง PDF ไม่สำเร็จ')); };
        document.head.appendChild(s);
      });
    }
    return html2pdfLoading;
  }
  /** A4 page (794px wide at 96dpi) with fixed colours — independent of the app's CSS variables so the PDF looks the same everywhere. */
  function salesReportPdfHtml(g) {
    var clinic = (state.master && state.master.clinicInfo) || {};
    var navy = '#1E3A72', gold = '#C9A961', ink = '#1C2440', muted = '#7A839F', line = '#E4E8F1', soft = '#F5F7FC';
    var baht = function (n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var logo = state.master && state.master.logoUrl
      ? '<img src="' + esc(state.master.logoUrl) + '" style="width:64px;height:64px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.6)">'
      : '<div style="width:64px;height:64px;border-radius:14px;background:' + gold + ';color:' + navy + ';display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700">VC</div>';
    var infoBox = function (title, rows) {
      return '<div style="flex:1;border:1px solid ' + line + ';border-radius:10px;overflow:hidden">' +
        '<div style="background:' + soft + ';padding:8px 14px;font-size:11.5px;font-weight:700;color:' + navy + '">' + esc(title) + '</div>' +
        '<div style="padding:10px 14px">' + rows.map(function (r) {
          return '<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12px"><span style="color:' + muted + '">' + esc(r[0]) + '</span><span style="font-weight:600;text-align:right">' + r[1] + '</span></div>';
        }).join('') + '</div></div>';
    };
    var itemRows = g.items.map(function (it, i) {
      return '<tr style="background:' + (i % 2 ? soft : '#fff') + '">' +
        '<td style="padding:10px 12px;color:' + muted + ';text-align:center">' + (i + 1) + '</td>' +
        '<td style="padding:10px 12px;font-weight:600">' + esc(it.itemName) + '</td>' +
        '<td style="padding:10px 12px;text-align:right">' + esc(it.qty) + '</td>' +
        '<td style="padding:10px 12px;color:' + muted + '">' + esc(it.unit || '') + '</td>' +
        '<td style="padding:10px 12px;text-align:right">' + baht(it.unitCost) + '</td>' +
        '<td style="padding:10px 12px;text-align:right;font-weight:600">' + baht(it.amount) + '</td></tr>';
    }).join('');
    var printed = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var printedText = printed.getFullYear() + '-' + pad(printed.getMonth() + 1) + '-' + pad(printed.getDate()) + ' ' + pad(printed.getHours()) + ':' + pad(printed.getMinutes());

  // Fields whose live value feeds a computed on-screen preview (the record
  // modal's revenue-share estimate + ยอดชำระเงิน total) need to refresh that
  // preview on every change — everything else (name/notes/free-text fields)
  // deliberately skips any update on plain typing so focus isn't disturbed
  // mid-keystroke. These specific inputs patch just the two preview boxes
  // via updateRecordPreview() (see its comment) rather than calling the
  // global render(), so the input being typed into is never recreated —
  // a full render() would otherwise reset a number input's caret to the
  // start on every keystroke, since freshly-created <input type="number">
  // elements don't support setSelectionRange for restoring it.
  var LIVE_PREVIEW_BIND_PATHS = { amount: 1, otherAmount: 1, canulaAmount: 1, doctorId: 1, salesId: 1 };
  // Round 13: any line-item group's `.amount` field (promoItems.N.amount,
  // medicineItems.N.amount, otherItems.N.amount) also feeds the live
  // preview — matched by suffix instead of listing every index.
  function isLivePreviewBindPath(p) { return !!LIVE_PREVIEW_BIND_PATHS[p] || /\.amount$/.test(p); }
  // A รายการโปร dropdown pick needs more than the generic setPath: the
  // chosen promo's price/doctorSharePct/name are denormalized onto that
  // line (client-side only, for the preview — see promoRows/previewShares)
  // and its "จำนวนเงินโปร" amount is pre-filled from the promo's price
  // whenever the line doesn't already have an amount, without clobbering a
  // value the staff already typed/edited.
  var PROMO_PICK_RE = /^promoItems\.(\d+)\.promoId$/;
  var STOCK_NAME_PICK_RE = /^(supplies|medicineItems)\.(\d+)\.name$/;
  var DISPENSE_FIELD_RE = /^medicineItems\.(\d+)\.(qtyDispensed|qtyUsed|unitPrice)$/;
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    var bindPath = el.getAttribute && el.getAttribute('data-bind');
    if (!bindPath || !state.draft) return;
    var moneyField = isMoneyBindPath(bindPath);
    var val = el.type === 'checkbox' ? el.checked : (moneyField ? parseMoneyInput(el.value) : (el.type === 'number' ? Number(el.value) : el.value));
    // Optional numeric fields (e.g. stock prices) keep '' instead of 0 when cleared.
    if (el.type === 'number' && el.value === '' && el.hasAttribute('data-blank-ok')) val = '';
    setPath(state.draft, bindPath, val);
    // จัดซื้อ: a line name matching a stock item links it (itemId) and takes that item's หมวดหมู่ — patched in place, no render.
    var orderPick = state.modal && state.modal.type === 'order' && bindPath.match(/^lines\.(\d+)\.itemName$/);
    if (orderPick) {
      var oLine = state.draft.lines[Number(orderPick[1])];
      var oItem = (state.suggestCache.stock || []).filter(function (s) { return s.name === String(val).trim(); })[0];
      oLine.itemId = oItem ? oItem.id : '';
      if (oItem && oItem.category && (state.master.stockCategories || []).some(function (c) { return c.name === oItem.category; })) {
        oLine.category = oItem.category;
        var catEl = document.querySelector('[data-bind="lines.' + orderPick[1] + '.category"]');
        if (catEl) catEl.value = oItem.category;
      }
      var capEl = document.getElementById('orderLineCap' + orderPick[1]);
      if (capEl) capEl.innerHTML = orderLineCaption(oLine);
      return;
    }
    // The stock form shows ราคาทุน/ราคาขาย only for ยา, so switching type redraws it.
    if (state.modal && state.modal.type === 'stock' && bindPath === 'type') { render(); return; }
    if (state.modal && state.modal.type === 'stockadjust') {
      if (bindPath === 'kind') { render(); return; } // label of the qty field depends on the kind
      var adjustPreview = document.getElementById('stockAdjustPreview');
      if (adjustPreview) adjustPreview.innerHTML = stockAdjustPreviewHtml(state.draft);
      return;
    }
    // Typing/picking a name that exactly matches a stock item links the line
    // to it (itemId) and, for a เวชภัณฑ์ line, fills its unit — patched
    // straight into the unit input, not via render(), so the caret stays put.
    var stockPick = bindPath.match(STOCK_NAME_PICK_RE);
    if (stockPick) {
      var stockLine = getPath(state.draft, stockPick[1] + '.' + stockPick[2]);
      var stockItem = stockItemsOfType(stockPick[1] === 'supplies' ? 'supply' : 'medicine').filter(function (s) { return s.name === val; })[0];
      if (stockLine) {
        stockLine.itemId = stockItem ? stockItem.id : '';
        if (stockItem && stockPick[1] === 'supplies' && stockItem.unit) {
          stockLine.unit = stockItem.unit;
          var unitEl = document.querySelector('[data-bind="supplies.' + stockPick[2] + '.unit"]');
          if (unitEl) unitEl.value = stockItem.unit;
        }
        // A picked ยา fills ราคาต่อหน่วย from its ราคาขาย tiers unless staff typed a price themselves.
        if (stockPick[1] === 'medicineItems') {
          var tierPrice = stockItem && !stockLine._priceManual ? medicineUnitPrice(stockItem.id, stockLine.qtyDispensed) : null;
          if (tierPrice != null) stockLine.unitPrice = tierPrice;
          recalcDispenseLine(stockLine);
          patchDispenseRow(Number(stockPick[2]), tierPrice != null); // also refreshes the name/price captions
        }
      }
      return;
    }
    var dispense = bindPath.match(DISPENSE_FIELD_RE);
    if (dispense) {
      var dLine = state.draft.medicineItems[Number(dispense[1])];
      var priceChanged = false;
      if (dispense[2] === 'unitPrice') dLine._priceManual = true;
      if (dispense[2] === 'qtyDispensed' && !dLine._priceManual && dLine.itemId) {
        var p2 = medicineUnitPrice(dLine.itemId, dLine.qtyDispensed);
        if (p2 != null && p2 !== dLine.unitPrice) { dLine.unitPrice = p2; priceChanged = true; }
      }
      recalcDispenseLine(dLine);
      patchDispenseRow(Number(dispense[1]), priceChanged);
      return;
    }
    var depositPick = bindPath.match(/^depositUseItems\.(\d+)\.itemId$/);
    if (depositPick) {
      var dep = (state.draft._deposits || []).filter(function (x) { return x.itemId === val; })[0];
      var useLine = state.draft.depositUseItems[Number(depositPick[1])];
      if (useLine) useLine.name = dep ? dep.name : (useLine.itemId ? useLine.name : '');
      return;
    }
    var promoPick = bindPath.match(PROMO_PICK_RE);
    if (promoPick) {
      var line = state.draft.promoItems[Number(promoPick[1])];
      var promo = (state.master.promotions || []).filter(function (p) { return p.id === val; })[0];
      if (line && promo) {
        line.name = promo.name; line.price = promo.price; line.doctorSharePct = promo.doctorSharePct;
        if (!line.amount) line.amount = promo.price;
      }
      render();
      return;
    }
    if (el.type === 'checkbox') {
      // Round 14 item 1.6: checking a รายการโปร/ยา/รายการอื่นๆ toggle on
      // (from empty) auto-creates its first row instead of making staff
      // click "+เพิ่มรายการ" separately.
      if (val === true) {
        if (bindPath === 'usePromo' && !state.draft.promoItems.length) state.draft.promoItems.push({ promoId: '', name: '', price: 0, doctorSharePct: 0, amount: 0 });
        else if (bindPath === 'useSupplies' && !state.draft.supplies.length) state.draft.supplies.push({ itemId: '', name: '', qty: 1, unit: '' });
        else if (bindPath === 'useMedicine' && !state.draft.medicineItems.length) state.draft.medicineItems.push(newDispenseLine());
        else if (bindPath === 'useOwnMed' && !state.draft.ownMedItems.length) state.draft.ownMedItems.push(NEW_LINE.ownMedItems());
        else if (bindPath === 'useDepositUse' && !state.draft.depositUseItems.length) state.draft.depositUseItems.push(NEW_LINE.depositUseItems());
        else if (bindPath === 'useMessenger' && !state.draft.messengerItems.length) state.draft.messengerItems.push(NEW_LINE.messengerItems());
        else if (bindPath === 'useOther' && !state.draft.otherItems.length) state.draft.otherItems.push({ label: '', amount: 0 });
      }
      render();
      return;
    }
    if (isLivePreviewBindPath(bindPath)) updateRecordPreview();
  });

  // Round 15 item 2.3: re-format a money field's displayed text to
  // "#,###.##" once the user leaves it — done on blur (via 'focusout',
  // which bubbles, unlike 'blur') rather than on every keystroke, so
  // reformatting never fights the caret position while typing.
  document.addEventListener('focusout', function (ev) {
    var el = ev.target;
    var bindPath = el.getAttribute && el.getAttribute('data-bind');
    if (!bindPath || !state.draft || !isMoneyBindPath(bindPath)) return;
    el.value = formatMoneyValue(getPath(state.draft, bindPath));
  });

  // Round 15 item 4: pressing Enter in a suggest-then-commit search box
  // commits the typed text as-is (no exact suggestion match required) —
  // an escape hatch for when the wanted result isn't in the small
  // suggestion list, without reintroducing a load on every keystroke.
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var wrap = ev.target.closest && ev.target.closest('[data-search-scope]');
    if (!wrap) return;
    var sc = SEARCH_SCOPES[wrap.getAttribute('data-search-scope')];
    if (!sc) return;
    ev.preventDefault();
    setPath(state, sc.qPath, ev.target.value);
    setPath(state, sc.suggestPath, []);
    render();
    sc.commit();
  });

  /* Expose the handful of functions used by inline oninput= attributes (search boxes need live typing without full re-render churn on every keystroke going through data-action). */
  window.__valin = {
    onListSearchInput: onListSearchInput,
    onPatientSuggestSearch: onPatientSuggestSearch, onPromotionSearch: onPromotionSearch, onWithdrawSearch: onWithdrawSearch
  };

  /* ---------------------------------------------------------------- */
  /* Bootstrap                                                           */
  /* ---------------------------------------------------------------- */
  function init() {
    if (session.token) {
      call('getCurrentUser', session.token, gsOpts({ quiet: true })).then(function (res) {
        if (res.ok) { session.user = res.user; afterLogin(); }
        else { resetToLogin(); }
      }, resetToLogin);
    } else {
      render();
    }
  }
  init();
})();
</script></body></html>
