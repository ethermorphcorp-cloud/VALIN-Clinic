<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
/* สต๊อกทั้งหมด — the read-only phone page the LINE buttons open (doGet ?page=stock&t=..., see renderStockPage_ in Code.gs).
   Same navy / gold glass look as the app. Everything is filtered in the browser from the list the server put in the page. */
:root{--navy:#1E3A72;--gold:#C9A961;--text:#1C2440;--muted:#8891AC;--amber:#B4791E;--amber-soft:#FBF1DE;--red:#AC4143;--red-soft:#FBEBEB;--green:#357552;--line:rgba(30,58,114,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--text);background:#EEF1F9;background-image:radial-gradient(500px 360px at 0% -5%,rgba(30,58,114,.18),transparent 60%),radial-gradient(420px 320px at 100% 0%,rgba(201,169,97,.25),transparent 60%);background-attachment:fixed;min-height:100vh}
.ms{font-family:'Material Symbols Rounded';font-size:20px;line-height:1;vertical-align:middle}
.wrap{max-width:560px;margin:0 auto}
.top{background:linear-gradient(160deg,#27488F,#14295A);color:#fff;padding:18px 16px 54px;border-radius:0 0 26px 26px}
.top .row{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.top h1{font-size:18px;margin:0}.top .sub{font-size:11.5px;opacity:.75}
.refresh{margin-left:auto;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-40px 12px 0;position:relative}
.tile{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:10px 11px;box-shadow:0 8px 24px rgba(30,58,114,.10);text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.tile .l{font-size:11px;color:var(--muted)}.tile .v{font-size:19px;font-weight:700;line-height:1.2}
.tile.warn .v{color:var(--amber)}.tile.out .v{color:var(--red)}.tile.on{outline:2px solid var(--navy)}
.sticky{position:sticky;top:0;z-index:5;padding:12px 12px 8px;background:linear-gradient(#EEF1F9 75%,rgba(238,241,249,0))}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;box-shadow:0 4px 14px rgba(30,58,114,.06)}
.search input{border:none;outline:none;background:none;font:inherit;font-size:16px;flex:1;min-width:0;color:var(--text)}
.clear{border:none;background:none;color:var(--muted);padding:4px;display:none;cursor:pointer}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;color:#3D4568;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:2px 16px 6px}
.list{padding:0 12px 28px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:11px 13px;box-shadow:0 2px 10px rgba(30,58,114,.05)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--green)}
.dot.warn{background:#E2A43B}.dot.out{background:var(--red)}
.nm{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}.sm{font-size:11.5px;color:var(--muted)}
.qty{margin-left:auto;text-align:right;flex:none}
.qty b{font-size:17px}.qty .u{font-size:12px;color:var(--muted);margin-left:2px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:2px}
.badge.warn{background:var(--amber-soft);color:var(--amber)}.badge.out{background:var(--red-soft);color:var(--red)}
.more{margin:4px auto 0;display:block;border:none;background:rgba(255,255,255,.85);border-radius:12px;padding:10px 18px;font:inherit;color:var(--navy);font-weight:600;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px}
.expired{margin:60px 20px;background:rgba(255,255,255,.85);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 8px 24px rgba(30,58,114,.10)}
.expired .ms{font-size:40px;color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
<? if (!valid) { ?>
  <div class="expired">
    <span class="ms">link_off</span>
    <h2 style="font-size:18px;margin:10px 0 6px">ลิงก์หมดอายุแล้ว</h2>
    <div style="font-size:13.5px;color:var(--muted);line-height:1.7">ลิงก์ดูสต๊อกใช้ได้ 24 ชั่วโมง<br>พิมพ์ <b style="color:var(--text)">สต๊อกทั้งหมด</b> ในแชท LINE ของคลินิก เพื่อรับลิงก์ใหม่</div>
  </div>
<? } else { ?>
  <div class="top"><div class="row">
    <div class="logo">VC</div>
    <div style="min-width:0"><h1>สต๊อกทั้งหมด</h1><div class="sub"><?= clinicName ?> · อัปเดต <?= updated ?></div></div>
    <a class="refresh" href="<?= selfUrl ?>" title="โหลดใหม่"><span class="ms">refresh</span></a>
  </div></div>
  <div class="tiles">
    <button class="tile" data-f="all"><div class="l">ทั้งหมด</div><div class="v" id="tAll"></div></button>
    <button class="tile warn" data-f="low"><div class="l">ต่ำกว่าขั้นต่ำ</div><div class="v" id="tLow"></div></button>
    <button class="tile out" data-f="out"><div class="l">หมดแล้ว</div><div class="v" id="tOut"></div></button>
  </div>
  <div class="sticky">
    <div class="search"><span class="ms" style="color:var(--muted)">search</span><input id="q" placeholder="ค้นหาชื่อยา / เวชภัณฑ์" autocomplete="off" value="<?= q ?>"><button class="clear" id="clear" aria-label="ล้างคำค้น"><span class="ms">close</span></button></div>
    <div class="chips"><button class="chip on" data-t="">ทั้งหมด</button><button class="chip" data-t="medicine">ยา</button><button class="chip" data-t="oral">ยาทาน</button><button class="chip" data-t="supply">เวชภัณฑ์</button></div>
  </div>
  <div class="meta"><span id="count"></span><span>เรียง: หมด / ใกล้หมดก่อน</span></div>
  <div class="list" id="list"></div>
  <script>
  var ITEMS = <?!= itemsJson ?>;
  var T = { medicine: 'ยา', oral: 'ยาทาน', supply: 'เวชภัณฑ์' };
  var st = { q: document.getElementById('q').value || '', t: '', f: 'all', n: 40 };
  function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function fmt(n) { return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US'); }
  function state(x) { return x.qty <= 0 ? 'out' : (x.min != null && x.qty < x.min ? 'warn' : 'ok'); }
  var ORDER = { out: 0, warn: 1, ok: 2 };
  function render() {
    var q = st.q.trim().toLowerCase();
    var base = ITEMS.filter(function (x) { return !st.t || x.type === st.t; });
    var rows = base.filter(function (x) {
      var s = state(x);
      return (!q || (x.name + ' ' + (x.cat || '')).toLowerCase().indexOf(q) > -1) && (st.f === 'all' || (st.f === 'low' ? s === 'warn' : s === 'out'));
    });
    rows.sort(function (a, b) { return ORDER[state(a)] - ORDER[state(b)] || String(a.name).localeCompare(String(b.name), 'th'); });
    document.getElementById('tAll').textContent = base.length;
    document.getElementById('tLow').textContent = base.filter(function (x) { return state(x) === 'warn'; }).length;
    document.getElementById('tOut').textContent = base.filter(function (x) { return state(x) === 'out'; }).length;
    Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (b) { b.classList.toggle('on', st.f !== 'all' && b.getAttribute('data-f') === st.f); });
    document.getElementById('count').textContent = rows.length + ' รายการ';
    document.getElementById('clear').style.display = st.q ? 'block' : 'none';
    var shown = rows.slice(0, st.n);
    document.getElementById('list').innerHTML = !rows.length ? '<div class="empty">ไม่พบรายการ</div>' : shown.map(function (x) {
      var s = state(x);
      return '<div class="item"><span class="dot ' + s + '"></span><div style="min-width:0"><div class="nm">' + esc(x.name) + '</div>' +
        '<div class="sm">' + T[x.type] + (x.cat ? ' · ' + esc(x.cat) : '') + (x.min != null ? ' · ขั้นต่ำ ' + fmt(x.min) : '') + '</div></div>' +
        '<div class="qty"><b style="color:' + (s === 'out' ? 'var(--red)' : s === 'warn' ? 'var(--amber)' : 'var(--text)') + '">' + fmt(x.qty) + '</b><span class="u">' + esc(x.unit) + '</span>' +
        (s !== 'ok' ? '<div><span class="badge ' + s + '">' + (s === 'out' ? 'หมด' : 'ใกล้หมด') + '</span></div>' : '') + '</div></div>';
    }).join('') + (rows.length > shown.length ? '<button class="more" id="more">แสดงเพิ่ม (' + (rows.length - shown.length) + ')</button>' : '');
    var m = document.getElementById('more');
    if (m) m.onclick = function () { st.n += 40; render(); };
  }
  document.getElementById('q').oninput = function (e) { st.q = e.target.value; st.n = 40; render(); };
  document.getElementById('clear').onclick = function () { st.q = ''; document.getElementById('q').value = ''; st.n = 40; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (x) { x.classList.remove('on'); });
      c.classList.add('on'); st.t = c.getAttribute('data-t'); st.n = 40; render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (b) {
    b.onclick = function () { var f = b.getAttribute('data-f'); st.f = (st.f === f || f === 'all') ? 'all' : f; st.n = 40; render(); };
  });
  render();
  </script>
<? } ?>
</div>
</body>
</html>
